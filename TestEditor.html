<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ВЕЗДЕХОД</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #1a1a1a; --text: #e0e0e0; --accent: #2481cc; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        /* Шапка */
        .header { padding: 10px; display: flex; justify-content: space-between; align-items: center; background: #252525; border-bottom: 1px solid #333; }
        .logo { font-weight: bold; color: var(--accent); letter-spacing: 1px; }

        /* Рабочая область */
        #container { flex-grow: 1; display: flex; justify-content: center; align-items: center; background: #111; position: relative; overflow: hidden; }
        canvas { max-width: 100%; max-height: 100%; box-shadow: 0 0 20px rgba(0,0,0,0.5); }

        /* Нижняя панель */
        .toolbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px; background: #252525; }
        button { background: #333; border: none; color: white; padding: 12px; border-radius: 8px; font-size: 18px; transition: 0.2s; }
        button:active { background: var(--accent); transform: scale(0.95); }
        .btn-main { background: var(--accent); }

        /* Скрытый инпут */
        #fileInput { display: none; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">ВЕЗДЕХОД v29</div>
    <div id="status" style="font-size: 10px; color: #666;">Ready</div>
</div>

<div id="container">
    <canvas id="canvas"></canvas>
</div>

<div class="toolbar">
    <button onclick="document.getElementById('fileInput').click()">📷</button>
    <button id="panicBtn">🔄</button>
    <button onclick="downloadImage()">💾</button>
    <button class="btn-main" onclick="sendToBot()">✅</button>
</div>

<input type="file" id="fileInput" accept="image/*" capture="environment">

<script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Разворачиваем на весь экран
    tg.ready();

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('fileInput');
    let panicCounter = 0;

    // Режим паники (3 нажатия на 🔄)
    document.getElementById('panicBtn').onclick = () => {
        panicCounter++;
        if (panicCounter >= 3) tg.close();
        setTimeout(() => panicCounter = 0, 1000);
    };

    fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                addWatermark();
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    };

    function addWatermark() {
        const now = new Date();
        const dateStr = now.toLocaleString('ru-RU');
        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.font = `${canvas.width / 30}px monospace`;
        ctx.fillText(`ВЕЗДЕХОД | ${dateStr}`, 20, canvas.height - 40);
        document.getElementById('status').innerText = "Обработано";
    }

    function downloadImage() {
        const link = document.createElement('a');
        link.download = 'vezdekhod_photo.jpg';
        link.href = canvas.toDataURL('image/jpeg', 0.8);
        link.click();
    }

    function sendToBot() {
        // В Mini App мы можем передать данные обратно боту
        tg.sendData("Photo_Ready"); 
        // Если бот настроен принимать данные, он получит это сообщение
        alert("Фото готово! Используйте кнопку сохранения или отправьте файл в чат.");
    }
</script>

</body>
</html>
