<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ВЕЗДЕХОД V38</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #header { padding: 10px; display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; }
        #view { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0a0a; position: relative; }
        canvas { max-width: 100%; max-height: 60vh; object-fit: contain; }
        
        .panel { background: #111; padding: 10px; border-top: 1px solid #333; }
        .marker-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
        .m-btn { background: #222; border: 1px solid #444; color: #fff; padding: 10px 5px; border-radius: 8px; font-size: 11px; text-align: center; }
        .m-btn:active { background: #333; }

        .color-bar { display: none; justify-content: space-around; padding: 10px; background: #1a1a1a; border-radius: 10px; margin-bottom: 10px; }
        .c-drop { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; }

        .input-bar { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
        #customText { flex-grow: 1; background: #222; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 5px; }
        
        .toolbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px; background: #1a1a1a; }
        .action { background: #333; border: none; color: white; padding: 15px; border-radius: 10px; font-size: 20px; }
        .btn-send { background: #2481cc !important; }

        #settingsModal { display: none; position: fixed; top: 20%; left: 10%; width: 80%; background: #222; padding: 20px; border-radius: 15px; border: 1px solid #2481cc; z-index: 1000; }
    </style>
</head>
<body>

<div id="header">
    <button onclick="toggleSettings()" style="background:none; border:none; color:#555; font-size: 20px;">⚙️</button>
    <div id="gps-status" style="font-size:10px; color:red;">🛰️ GPS SEARCH</div>
    <button onclick="updateGeo()" style="background:none; border:none; font-size: 20px;">📍</button>
</div>

<div id="view">
    <canvas id="canvas"></canvas>
    <div id="info" style="color:#0f0; font-family:monospace; font-size:14px; margin-top:5px;"></div>
</div>

<div class="panel">
    <div class="marker-bar">
        <div class="m-btn" onclick="showColors('МАГНИТ')">🧲<br>МАГНИТ</div>
        <div class="m-btn" onclick="showColors('ТАЙНИК')">📦<br>ТАЙНИК</div>
        <div class="m-btn" onclick="showColors('ПОДЪЕЗД')">🏢<br>ПОДЪЕЗД</div>
    </div>

    <div id="colorBar" class="color-bar">
        <div class="c-drop" style="background: yellow;" onclick="applyAll('yellow')"></div>
        <div class="c-drop" style="background: red;" onclick="applyAll('red')"></div>
        <div class="c-drop" style="background: #00ccff;" onclick="applyAll('#00ccff')"></div>
    </div>

    <div class="input-bar">
        <span>📝</span>
        <input type="text" id="customText" placeholder="Свой текст...">
        <button id="pinBtn" onclick="togglePin()" style="background:#222; border:1px solid #444; color:#555; padding:8px; border-radius:5px;">📌</button>
    </div>
</div>

<div id="settingsModal">
    <h4 style="margin:0">Настройки</h4>
    <input type="text" id="targetBot" style="width:100%; margin:10px 0; padding:10px; background:#111; color:#fff; border:1px solid #444;" placeholder="@username_bot">
    <button onclick="saveSettings()" style="width:100%; background:#2481cc; border:none; color:#fff; padding:10px; border-radius:5px;">СОХРАНИТЬ</button>
</div>

<div class="toolbar">
    <button class="action" onclick="document.getElementById('cam').click()">📷</button>
    <button class="action" id="panic">🔄</button>
    <button class="action" onclick="saveFile()">💾</button>
    <button class="action btn-send" onclick="sendToBot()">✅</button>
</div>

<input type="file" id="cam" accept="image/*" capture="environment" style="display:none">

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let coords = "0.0, 0.0", addr = "Поиск...", selectedLabel = "", selectedColor = "yellow", isPinned = false;
    let originalImg = null;

    function toggleSettings() { const m = document.getElementById('settingsModal'); m.style.display = m.style.display === 'block' ? 'none' : 'block'; }
    function saveSettings() { localStorage.setItem('bot', document.getElementById('targetBot').value); toggleSettings(); }
    document.getElementById('targetBot').value = localStorage.getItem('bot') || '';

    function togglePin() { isPinned = !isPinned; document.getElementById('pinBtn').style.color = isPinned ? '#0f0' : '#555'; }

    function showColors(label) { selectedLabel = label; document.getElementById('colorBar').style.display = 'flex'; }

    function updateGeo() {
        navigator.geolocation.getCurrentPosition(p => {
            coords = `${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)}`;
            document.getElementById('info').innerText = coords;
            document.getElementById('gps-status').innerText = "🛰️ OK";
            document.getElementById('gps-status').style.color = "#0f0";
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${p.coords.latitude}&lon=${p.coords.longitude}`)
                .then(r => r.json()).then(d => addr = d.address.road + (d.address.house_number ? ', ' + d.address.house_number : ''));
        }, null, {enableHighAccuracy:true});
    }
    updateGeo();

    document.getElementById('cam').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            originalImg = new Image();
            originalImg.onload = () => { draw(); };
            originalImg.src = ev.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    function applyAll(color) { 
        selectedColor = color; 
        document.getElementById('colorBar').style.display = 'none';
        draw(); 
    }

    function draw() {
        if(!originalImg) return;
        canvas.width = originalImg.width;
        canvas.height = originalImg.height;
        ctx.drawImage(originalImg, 0, 0);
        
        const h = canvas.height * 0.15;
        ctx.fillStyle = "rgba(0,0,0,0.8)";
        ctx.fillRect(0, canvas.height - h, canvas.width, h);
        
        const fs = h * 0.25;
        ctx.fillStyle = "#0f0";
        ctx.font = `bold ${fs}px monospace`;
        ctx.fillText(coords, 20, canvas.height - h * 0.6);
        
        ctx.fillStyle = "#fff";
        ctx.font = `${fs * 0.7}px sans-serif`;
        ctx.fillText(addr, 20, canvas.height - h * 0.35);

        const custom = document.getElementById('customText').value || selectedLabel;
        if(custom) {
            ctx.fillStyle = selectedColor;
            ctx.font = `bold ${fs}px sans-serif`;
            ctx.fillText(custom, 20, canvas.height - h * 0.85);
        }
        if(!isPinned && !document.getElementById('customText').value) selectedLabel = ""; 
    }

    function saveFile() {
        const link = document.createElement('a');
        link.download = `VZ.jpg`;
        link.href = canvas.toDataURL('image/jpeg', 0.9);
        link.click();
    }

    function sendToBot() {
        const b = localStorage.getItem('bot') || "None";
        tg.sendData(`SEND|${b}|${coords}`);
        tg.showAlert("Отправлено в " + b);
        tg.close();
    }

    let p = 0;
    document.getElementById('panic').onclick = () => { p++; if(p>=3) tg.close(); setTimeout(()=>p=0, 1000); };
</script>

</body>
</html>
