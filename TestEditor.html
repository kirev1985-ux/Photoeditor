<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Geo Camera Editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden;
        }
        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
        }
        #videoWrapper {
            position: relative;
            flex: 1;
            overflow: hidden;
            background: #000;
        }
        #video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            touch-action: none;
        }
        #toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.8);
        }
        #toolbar button {
            flex: 1;
            min-width: 0;
            padding: 8px;
            border-radius: 6px;
            border: none;
            background: #1c1c1e;
            color: #fff;
            font-size: 14px;
        }
        #toolbar button.active {
            background: #007aff;
        }
        #info {
            padding: 6px 8px;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.8);
        }
        #coords.good {
            color: #0f0;
        }
        #coords.bad {
            color: #f00;
        }
        #preview {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
            box-sizing: border-box;
        }
        #previewImg {
            max-width: 100%;
            max-height: 70%;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        #previewButtons {
            display: flex;
            gap: 8px;
            width: 100%;
        }
