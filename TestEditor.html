<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>V43 PRO</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
    margin:0;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

#view { flex:1; position:relative; background:#000; }
video, canvas {
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
}

.toolbar {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    padding:12px;
    background:#111;
}

.action {
    font-size:20px;
    padding:14px;
    border-radius:12px;
    border:none;
    background:#333;
    color:#fff;
}
</style>
</head>

<body>

<div id="view">
    <video id="video" playsinline></video>
    <canvas id="canvas"></canvas>
</div>

<div class="toolbar">
    <button class="action" onclick="startCamera()">📷</button>
    <button class="action" onclick="snapshot()">🖼</button>
    <button class="action" onclick="sendToBot()">✅</button>
    <button class="action" onclick="clearCanvas()">🔄</button>
</div>

<script>
/* ================== INIT ================== */
const tg = window.Telegram.WebApp;
tg.expand();

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let stream = null;
let lastImage = null;

let coords = '0,0';
let acc = 0;
let addr = '';

/* ================== CAMERA ================== */
async function startCamera() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { width:{ideal:1920}, height:{ideal:1080} },
            audio:false
        });
        video.srcObject = stream;
        await video.play();
        resizeCanvas();
    } catch (e) {
        alert("❌ Камера недоступна в Telegram");
        console.error(e);
    }
}

function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = video.videoWidth * dpr;
    canvas.height = video.videoHeight * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
}

/* ================== GEO ================== */
navigator.geolocation.watchPosition(p=>{
    coords = `${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)}`;
    acc = Math.round(p.coords.accuracy);
    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${p.coords.latitude}&lon=${p.coords.longitude}`)
        .then(r=>r.json())
        .then(d=> addr = d.display_name || '');
},{}, {enableHighAccuracy:true});

/* ================== SNAPSHOT ================== */
function snapshot() {
    if(!video.videoWidth) return alert("Камера не запущена");

    const w = video.videoWidth;
    const h = video.videoHeight;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Фото
    ctx.drawImage(video,0,0,w,h);

    // Нижняя панель
    const barH = h * 0.18;
    ctx.fillStyle = "rgba(0,0,0,0.75)";
    ctx.fillRect(0,h-barH,w,barH);

    // Координаты
    ctx.fillStyle = acc > 15 ? "red" : "#0f0";
    ctx.font = "bold 22px monospace";
    ctx.fillText(`📍 ${coords} (±${acc}м)`,20,h-barH+30);

    // Адрес
    ctx.fillStyle = "#fff";
    ctx.font = "16px Arial";
    wrapText(addr,20,h-barH+60,w-40,18);

    lastImage = canvas.toDataURL("image/jpeg",0.95);
}

/* ================== TEXT WRAP ================== */
function wrapText(text,x,y,maxWidth,lineHeight){
    const words=text.split(' ');
    let line='';
    for(let n=0;n<words.length;n++){
        const test=line+words[n]+' ';
        if(ctx.measureText(test).width>maxWidth){
            ctx.fillText(line,x,y);
            line=words[n]+' ';
            y+=lineHeight;
        } else line=test;
    }
    ctx.fillText(line,x,y);
}

/* ================== SEND ================== */
function sendToBot(){
    if(!lastImage) return alert("Сначала сделайте фото");

    tg.sendData(JSON.stringify({
        image:lastImage,
        coords,
        acc,
        addr,
        ts:Date.now()
    }));
    tg.close();
}

/* ================== CLEAR ================== */
function clearCanvas(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    lastImage=null;
}
</script>

</body>
</html>
