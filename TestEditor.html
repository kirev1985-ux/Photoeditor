<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ВЕЗДЕХОД V40</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #header { padding: 8px; display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; border-bottom: 1px solid #333; }
        #view { flex-grow: 1; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; position: relative; }
        canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .panel { background: #111; padding: 10px; border-top: 1px solid #333; }
        .marker-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
        .m-btn { background: #222; border: 1px solid #444; color: #fff; padding: 12px 5px; border-radius: 8px; font-size: 11px; text-align: center; font-weight: bold; }
        
        .color-bar { display: none; justify-content: space-around; padding: 12px; background: #222; border-radius: 10px; margin-bottom: 10px; border: 1px solid #2481cc; }
        .c-drop { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #fff; }

        .input-bar { display: flex; align-items: center; gap: 8px; }
        #customText { flex-grow: 1; background: #1a1a1a; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 6px; }
        
        .toolbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px 15px 25px; background: #1a1a1a; }
        .action { background: #333; border: none; color: white; padding: 16px; border-radius: 12px; font-size: 22px; }
        .btn-send { background: #2481cc !important; }
    </style>
</head>
<body>

<div id="header">
    <button onclick="toggleSettings()" style="background:none; border:none; color:#555; font-size: 22px;">⚙️</button>
    <div id="gps-status" style="font-size:10px; color:red; font-weight:bold;">🛰️ СВЯЗЬ...</div>
    <button onclick="updateGeo()" style="background:none; border:none; font-size: 22px;">📍</button>
</div>

<div id="view">
    <canvas id="canvas"></canvas>
</div>

<div class="panel">
    <div class="marker-bar">
        <div class="m-btn" onclick="showColors('МАГНИТ')">🧲<br>МАГНИТ</div>
        <div class="m-btn" onclick="showColors('ТАЙНИК')">📦<br>ТАЙНИК</div>
        <div class="m-btn" onclick="showColors('ПОДЪЕЗД')">🏢<br>ПОДЪЕЗД</div>
    </div>
    <div id="colorBar" class="color-bar">
        <div class="c-drop" style="background: #ffff00;" onclick="applyColor('#ffff00')"></div>
        <div class="c-drop" style="background: #ff0000;" onclick="applyColor('#ff0000')"></div>
        <div class="c-drop" style="background: #00ccff;" onclick="applyColor('#00ccff')"></div>
    </div>
    <div class="input-bar">
        <span>📝</span>
        <input type="text" id="customText" placeholder="Надпись...">
        <button id="pinBtn" onclick="togglePin()" style="background:#222; border:1px solid #444; color:#555; padding:10px; border-radius:6px; font-size:18px;">📌</button>
    </div>
</div>

<div class="toolbar">
    <button class="action" onclick="openCam()">📷</button>
    <button class="action" id="panic">🔄</button>
    <button class="action" onclick="saveFile()">💾</button>
    <button class="action btn-send" onclick="sendToBot()">✅</button>
</div>

<input type="file" id="cam" accept="image/*" capture="environment" style="display:none">

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let coords = "0.000000, 0.000000", acc = "0", addr = "Ищем адрес...", label = "", color = "#ffff00", pinned = false, imgObj = null;

    function openCam() { 
        const c = document.getElementById('cam');
        c.value = ''; // Сброс
        c.click(); 
    }

    function togglePin() { pinned = !pinned; document.getElementById('pinBtn').style.color = pinned ? '#0f0' : '#555'; }
    function showColors(l) { label = l; document.getElementById('colorBar').style.display = 'flex'; }
    function applyColor(c) { color = c; document.getElementById('colorBar').style.display = 'none'; render(); }
    function toggleSettings() { tg.showAlert("Настройки: введите @bot в поле кнопки ✅"); }

    function updateGeo() {
        navigator.geolocation.getCurrentPosition(p => {
            coords = `${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)}`;
            acc = p.coords.accuracy.toFixed(0);
            document.getElementById('gps-status').innerText = "🛰️ OK";
            document.getElementById('gps-status').style.color = "#0f0";
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${p.coords.latitude}&lon=${p.coords.longitude}`)
                .then(r => r.json()).then(d => {
                    addr = (d.address.road || "") + (d.address.house_number ? ", " + d.address.house_number : "");
                    render();
                });
        }, null, {enableHighAccuracy:true});
    }
    updateGeo(); setInterval(updateGeo, 10000);

    document.getElementById('cam').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            imgObj = new Image();
            imgObj.onload = render;
            imgObj.src = ev.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    function render() {
        if (!imgObj) return;
        // Делаем холст вертикальным (9:16) под размер фото
        canvas.width = imgObj.width;
        canvas.height = imgObj.height;
        ctx.drawImage(imgObj, 0, 0);

        const h = canvas.height * 0.12;
        const fs = h * 0.3;

        // НИЖНЯЯ ПАНЕЛЬ (Гео)
        ctx.fillStyle = "rgba(0,0,0,0.85)";
        ctx.fillRect(0, canvas.height - h, canvas.width, h);
        ctx.fillStyle = "#0f0";
        ctx.font = `bold ${fs}px monospace`;
        ctx.fillText(`${coords} (±${acc}м)`, 30, canvas.height - h * 0.55);
        ctx.fillStyle = "#0cf";
        ctx.font = `${fs * 0.7}px sans-serif`;
        ctx.fillText(addr, 30, canvas.height - h * 0.25);

        // ВЕРХНЯЯ ПАНЕЛЬ (Текст)
        const txt = document.getElementById('customText').value || label;
        if (txt) {
            ctx.fillStyle = "rgba(0,0,0,0.6)";
            ctx.fillRect(0, 0, canvas.width, h * 0.8);
            ctx.fillStyle = color;
            ctx.font = `bold ${fs * 1.2}px sans-serif`;
            ctx.textAlign = "center";
            ctx.fillText(txt, canvas.width/2, h * 0.5);
            ctx.textAlign = "left";
        }
        if (!pinned && !document.getElementById('customText').value) label = "";
    }

    function saveFile() {
        if(!imgObj) return;
        const link = document.createElement('a');
        link.download = `VZ_${Date.now()}.jpg`;
        link.href = canvas.toDataURL('image/jpeg', 0.95);
        link.click();
    }

    function sendToBot() {
        if(!imgObj) return;
        tg.sendData(`SEND|${coords}|${addr}`);
        tg.close();
    }

    let p = 0; document.getElementById('panic').onclick = () => { p++; if(p>=3) tg.close(); setTimeout(()=>p=0, 1000); };
</script>
</body>
</html>
