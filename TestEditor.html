<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Geo Camera Editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden;
        }
        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
        }
        #videoWrapper {
            position: relative;
            flex: 1;
            overflow: hidden;
            background: #000;
        }
        #video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            touch-action: none;
        }
        #toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.8);
        }
        #toolbar button {
            flex: 1;
            min-width: 0;
            padding: 8px;
            border-radius: 6px;
            border: none;
            background: #1c1c1e;
            color: #fff;
            font-size: 14px;
        }
        #toolbar button.active {
            background: #007aff;
        }
        #info {
            padding: 6px 8px;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.8);
        }
        #coords.good {
            color: #0f0;
        }
        #coords.bad {
            color: #f00;
        }
        #preview {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
            box-sizing: border-box;
        }
        #previewImg {
            max-width: 100%;
            max-height: 70%;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        #previewButtons {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        #previewButtons button {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-size: 15px;
        }
        #previewButtons .ok {
            background: #34c759;
            color: #000;
        }
        #previewButtons .cancel {
            background: #ff3b30;
            color: #fff;
        }
        #textInputWrapper {
            display: flex;
            gap: 6px;
            padding: 4px 8px 8px;
            background: rgba(0, 0, 0, 0.8);
        }
        #text {
            flex: 1;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #111;
            color: #fff;
            font-size: 14px;
        }
        #pinBtn {
            padding: 6px 8px;
            border-radius: 6px;
            border: none;
            background: #1c1c1e;
            color: #fff;
            font-size: 14px;
        }
        #pinBtn.active {
            background: #ffcc00;
            color: #000;
        }
    </style>
</head>
<body>
<div id="app">
    <div id="videoWrapper">
        <video id="video" autoplay playsinline></video>
        <canvas id="overlay"></canvas>
    </div>

    <div id="info">
        <div id="coords">Координаты: —</div>
        <div id="addr">Адрес: определение…</div>
    </div>

    <div id="textInputWrapper">
        <input id="text" type="text" placeholder="Текст для плашки">
        <button id="pinBtn" onclick="togglePin()">📌</button>
    </div>

    <div id="toolbar">
        <button onclick="toggleCam()">🔁 Камера</button>
        <button onclick="toggleDraw()">✏️ Рисовать</button>
        <button onclick="addTextMode()">🔤 Текст</button>
        <button onclick="addGPSMode()">📍 GPS</button>
        <button onclick="undo()">↩️ Отмена</button>
        <button onclick="takePhoto()">📸 Снять</button>
    </div>
</div>

<div id="preview">
    <img id="previewImg" src="">
    <div id="previewButtons">
        <button class="cancel" onclick="discardPhoto()">Отмена</button>
        <button class="ok" onclick="keepPhoto()">Отправить</button>
    </div>
</div>

<script>
    // Telegram WebApp (без краша в обычном браузере)
    const tg = window.Telegram && Telegram.WebApp ? Telegram.WebApp : null;
    if (tg) {
        tg.expand();
    }

    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const octx = overlay.getContext('2d');
    const preview = document.getElementById('preview');
    const previewImg = document.getElementById('previewImg');

    let stream = null;
    let facingMode = 'environment';
    let drawing = false;
    let mode = 'none'; // none, draw, text, gps
    let startX, startY;
    let history = [];
    let pinnedText = '';
    let pin = false;
    let coords = '0.000000, 0.000000';
    let acc = 0;
    let addr = 'Определение адреса…';

    // Camera
    async function initCam() {
        try {
            if (stream) stream.getTracks().forEach(t => t.stop());

            // сначала пробуем exact, если упадёт — fallback
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: facingMode } }
