<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Photo Report Final Fix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; color: white; }
        #viewport { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; touch-action: none; }
        canvas { background: #111; touch-action: none; display: block; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        #toolbar { position: fixed; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 10px; z-index: 100; }
        .btn { width: 52px; height: 52px; background: rgba(30,30,30,0.9); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; font-size: 24px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; }
        .btn.active { border: 2px solid #00ff00; background: rgba(0,255,0,0.15); transform: scale(0.9); }

        #bottomBar { position: fixed; bottom: 20px; left: 0; width: 100%; display: flex; justify-content: center; align-items: center; gap: 30px; z-index: 100; }
        .bottom-btn { width: 62px; height: 62px; background: rgba(40,40,40,0.9); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; font-size: 28px; display: flex; justify-content: center; align-items: center; }

        #modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 200; }
        #modalBox { width: 85%; background: #1a1a1a; padding: 20px; border-radius: 15px; }
        input, textarea { width: 100%; margin: 10px 0; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; box-sizing: border-box; }
        input[type=file] { display: none; }
    </style>
</head>
<body>

<div id="viewport">
    <canvas id="canvas"></canvas>
</div>

<div id="toolbar">
    <label class="btn">📸<input type="file" accept="image/*" capture="environment" id="cameraInput"></label>
    <label class="btn">🖼<input type="file" accept="image/*" id="galleryInput"></label>
    <div class="btn" id="drawBtn" onclick="toggleMode('draw')">✏️</div>
    <div class="btn" id="eraseBtn" onclick="toggleMode('erase')">🧽</div>
    <div class="btn" id="geoBtn" onclick="toggleSticky('geo')">📍</div>
    <div class="btn" id="textBtn" onclick="toggleSticky('text')">📝</div>
    <div class="btn" onclick="saveImage()">💾</div>
</div>

<div id="bottomBar">
    <div class="bottom-btn" onclick="safeUndo()">↩️</div>
    <div class="bottom-btn" onclick="triggerCamera()">📷</div>
    <div class="bottom-btn" onclick="safeRedo()">↪️</div>
</div>

<div id="modal">
    <div id="modalBox">
        <h4 style="margin:0">Настройки текста</h4>
        <input id="titleInput" placeholder="Заголовок">
        <textarea id="descInput" rows="3" placeholder="Описание"></textarea>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button onclick="closeModal()" style="flex:1; padding:12px; background:#444; color:#fff; border:none; border-radius:8px;">Закрыть</button>
            <button onclick="applyText()" style="flex:1; padding:12px; background:#007bff; color:#fff; border:none; border-radius:8px;">ОК</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let currentMode = 'view';
    let history = [], redoStack = [];
    let sticky = { geo: false, text: false };
    let textBuffer = { title: "", desc: "" };
    
    let scale = 1, posX = 0, posY = 0, lastPosX = 0, lastPosY = 0;

    function initCanvas() {
        const w = window.innerWidth * 0.95;
        const h = w * (16/9);
        const dpr = 2;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        ctx.scale(dpr, dpr);
        ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = 3;
        ctx.fillStyle = "#1a1a1a";
        ctx.fillRect(0, 0, w, h);
        saveState();
    }

    function toggleMode(mode) {
        document.getElementById("drawBtn").classList.remove("active");
        document.getElementById("eraseBtn").classList.remove("active");
        if (currentMode === mode) { currentMode = 'view'; } 
        else { currentMode = mode; document.getElementById(mode + "Btn").classList.add("active"); }
    }

    function toggleSticky(type) {
        sticky[type] = !sticky[type];
        document.getElementById(type + "Btn").classList.toggle("active", sticky[type]);
        if (type === 'text' && sticky.text) { openModal(); }
        if (type === 'geo' && sticky.geo) { fetchGeo(); }
    }

    function handleFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
            const cw = canvas.width / 2;
            const ch = canvas.height / 2;
            ctx.clearRect(0, 0, cw, ch);
            const ratio = Math.max(cw / img.width, ch / img.height);
            const nw = img.width * ratio;
            const nh = img.height * ratio;
            ctx.drawImage(img, (cw - nw) / 2, (ch - nh) / 2, nw, nh);
            
            if (sticky.text && textBuffer.title) drawDataBlock(textBuffer.title, textBuffer.desc, 'top');
            if (sticky.geo) fetchGeo();
            
            saveState();
            resetZoom();
            URL.revokeObjectURL(url);
        };
        img.src = url;
    }

    async function fetchGeo() {
        if (!navigator.geolocation) return;
        
        navigator.geolocation.getCurrentPosition(async (p) => {
            const lat = p.coords.latitude;
            const lon = p.coords.longitude;
            const acc = p.coords.accuracy;
            const line1 = `📍 ${lat.toFixed(6)}, ${lon.toFixed(6)} (±${acc.toFixed(0)}м)`;
            
            drawDataBlock(line1, "Определяю адрес...", 'bottom');

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&addressdetails=1`);
                const data = await res.json();
                const addr = `${data.address.city || data.address.town || ''}, ${data.address.road || ''} ${data.address.house_number || ''}`;
                
                safeUndo(); // Стираем блок "Определяю адрес"
                drawDataBlock(line1, addr, 'bottom');
            } catch (e) {
                console.warn("Адрес не подгружен");
            }
        }, null, { enableHighAccuracy: true, timeout: 5000 });
    }

    function applyText() {
        textBuffer.title = document.getElementById("titleInput").value;
        textBuffer.desc = document.getElementById("descInput").value;
        drawDataBlock(textBuffer.title, textBuffer.desc, 'top');
        closeModal();
    }

    function drawDataBlock(t1, t2, pos) {
        const cw = canvas.width / 2;
        const ch = canvas.height / 2;
        const y = (pos === 'top') ? 20 : ch - 85;
        
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.fillRect(10, y, cw - 20, 65);
        
        ctx.fillStyle = "white";
        ctx.font = "bold 14px Arial";
        ctx.fillText(t1, 20, y + 26);
        ctx.font = "12px Arial";
        ctx.fillText(t2, 20, y + 50);
        saveState();
    }

    function saveState() {
        history.push(canvas.toDataURL("image/png"));
        if (history.length > 30) history.shift();
        redoStack = [];
    }

    function safeUndo() {
        if (history.length > 1) {
            redoStack.push(history.pop());
            renderFromHistory(history[history.length - 1]);
        }
    }

    function safeRedo() {
        if (redoStack.length > 0) {
            const data = redoStack.pop();
            history.push(data);
            renderFromHistory(data);
        }
    }

    function renderFromHistory(src) {
        const img = new Image();
        img.onload = () => {
            ctx.clearRect(0, 0, canvas.width/2, canvas.height/2);
            ctx.drawImage(img, 0, 0, canvas.width/2, canvas.height/2);
        };
        img.src = src;
    }

    const vp = document.getElementById("viewport");
    vp.addEventListener('touchstart', e => {
        if (currentMode !== 'view' && e.touches.length === 1) {
            ctx.beginPath();
            const r = canvas.getBoundingClientRect();
            const x = (e.touches[0].clientX - r.left) * (canvas.width / r.width / 2);
            const y = (e.touches[0].clientY - r.top) * (canvas.height / r.height / 2);
            ctx.moveTo(x, y);
        }
        lastPosX = e.touches[0].clientX - posX; lastPosY = e.touches[0].clientY - posY;
    });

    vp.addEventListener('touchmove', e => {
        if (currentMode !== 'view') {
            ctx.globalCompositeOperation = (currentMode === 'erase') ? "destination-out" : "source-over";
            ctx.strokeStyle = "red";
            const r = canvas.getBoundingClientRect();
            const x = (e.touches[0].clientX - r.left) * (canvas.width / r.width / 2);
            const y = (e.touches[0].clientY - r.top) * (canvas.height / r.height / 2);
            ctx.lineTo(x, y); ctx.stroke();
        } else {
            posX = e.touches[0].clientX - lastPosX;
            posY = e.touches[0].clientY - lastPosY;
            canvas.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
        }
    });

    vp.addEventListener('touchend', () => { if(currentMode !== 'view') saveState(); });

    function saveImage() {
        resetZoom();
        setTimeout(() => {
            try {
                const link = document.createElement('a');
                link.download = `IMG_${Date.now()}.png`;
                link.href = canvas.toDataURL("image/png", 1.0);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (err) {
                alert("Ошибка сохранения. Попробуйте еще раз.");
            }
        }, 500);
    }

    function resetZoom() { scale = 1; posX = 0; posY = 0; canvas.style.transform = "none"; }
    function openModal() { document.getElementById("titleInput").value = textBuffer.title; document.getElementById("descInput").value = textBuffer.desc; document.getElementById("modal").style.display = "flex"; }
    function closeModal() { document.getElementById("modal").style.display = "none"; }
    function triggerCamera() { document.getElementById("cameraInput").click(); }
    document.getElementById("cameraInput").onchange = handleFile;
    document.getElementById("galleryInput").onchange = handleFile;

    window.onload = initCanvas;
</script>
</body>
</html>
