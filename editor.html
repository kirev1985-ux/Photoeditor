<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Фоторедактор</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body { margin:0; overflow:hidden; background:#000; color:#fff; font-family:system-ui, sans-serif; }
    #canvas { width:100vw; height:100vh; touch-action:none; display:block; }
    
    /* Верхняя панель инструментов */
    #toolbar {
        position:fixed; right:12px; top:12px; display:flex; flex-direction:column; gap:10px; z-index:100;
    }
    .btn {
        width:44px; height:44px; background:rgba(40,40,40,0.8); border:1px solid rgba(255,255,255,0.2);
        border-radius:12px; font-size:24px; display:flex; justify-content:center; align-items:center;
        cursor:pointer; user-select:none;
    }
    .btn:active { background:rgba(80,80,80,0.9); }

    input[type=file] { display:none; }

    /* Нижняя панель — компактная */
    #bottomBar {
        position:fixed; bottom:16px; left:0; width:100%; display:flex; justify-content:center; align-items:center; gap:60px; z-index:90;
    }
    .bottom-btn {
        width:48px; height:48px; background:rgba(40,40,40,0.8); border:1px solid rgba(255,255,255,0.2);
        border-radius:50%; font-size:24px; display:flex; justify-content:center; align-items:center;
        user-select:none;
    }
    .bottom-btn.small {
        width:36px; height:36px; font-size:20px; background:transparent; border:none;
    }

    /* Модалка и тост */
    #modal {
        position:fixed; inset:0; background:rgba(0,0,0,0.9); display:none; justify-content:center; align-items:center; z-index:200;
    }
    #modalBox {
        width:90%; max-width:380px; background:#1a1a1a; padding:24px; border-radius:16px; border:1px solid #444;
    }
    #modalBox input, #modalBox textarea {
        width:100%; margin:12px 0; padding:12px; border-radius:10px; border:1px solid #555;
        background:#222; color:#fff; font-size:16px;
    }
    #modalButtons { margin-top:20px; display:flex; gap:12px; }
    #modalButtons button { flex:1; padding:14px; border-radius:10px; font-size:16px; cursor:pointer; }
    #cancelBtn { background:#444; color:#fff; border:none; }
    #okBtn     { background:#0066ff; color:#fff; border:none; }

    #toast {
        position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
        background:rgba(0,0,0,0.85); padding:12px 20px; border-radius:12px; font-size:16px;
        display:none; z-index:150;
    }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="toolbar">
    <label class="btn">📸<input type="file" accept="image/*" capture="environment" id="cameraInput"></label>
    <label class="btn">🖼<input type="file" accept="image/*" id="galleryInput"></label>
    <div class="btn" onclick="setMode('draw')">✏️</div>
    <div class="btn" onclick="setMode('erase')">🧽</div>
    <div class="btn" onclick="addGeo()">📍</div>
    <div class="btn" onclick="openModal()">📝</div>
    <div class="btn" onclick="saveImage()">💾</div>
</div>

<div id="bottomBar">
    <div class="bottom-btn small" id="undoBtn">←</div>
    <div class="bottom-btn" onclick="triggerCamera()">📸</div>
    <div class="bottom-btn small" id="redoBtn">→</div>
</div>

<div id="modal">
    <div id="modalBox">
        <label>Название</label>
        <input id="titleInput" placeholder="Название">

        <label>Описание</label>
        <textarea id="descInput" rows="4" placeholder="Что на фото?"></textarea>

        <div id="modalButtons">
            <button id="cancelBtn" onclick="closeModal()">Отмена</button>
            <button id="okBtn" onclick="applyText()">OK</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let mode = "draw";
let drawing = false;
let lastX, lastY;
let history = [];
let redoStack = [];

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

function saveState() {
    history.push(canvas.toDataURL());
    redoStack = [];
}

function undo() {
    if (history.length > 1) {
        redoStack.push(history.pop());
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        img.src = history[history.length - 1];
    }
}

function redo() {
    if (redoStack.length > 0) {
        const state = redoStack.pop();
        history.push(state);
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        img.src = state;
    }
}

document.getElementById("undoBtn").onclick = undo;
document.getElementById("redoBtn").onclick = redo;

function loadImage(file) {
    const reader = new FileReader();
    reader.onload = e => {
        const img = new Image();
        img.onload = () => {
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            saveState();
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

document.getElementById("cameraInput").onchange = e => loadImage(e.target.files[0]);
document.getElementById("galleryInput").onchange = e => loadImage(e.target.files[0]);

function triggerCamera() { document.getElementById("cameraInput").click(); }

function getPos(e) {
    const t = e.touches?.[0] || e.changedTouches?.[0] || e;
    const r = canvas.getBoundingClientRect();
    return { x: t.clientX - r.left, y: t.clientY - r.top };
}

canvas.addEventListener("touchstart", e => {
    e.preventDefault();
    const pos = getPos(e);
    drawing = true;
    lastX = pos.x; lastY = pos.y;
    if (mode === "draw" || mode === "erase") ctx.beginPath(), ctx.moveTo(lastX, lastY);
});

canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    if (!drawing) return;
    const pos = getPos(e);
    if (mode === "draw") {
        ctx.strokeStyle = "#ff3366"; ctx.lineWidth = 5; ctx.lineCap = "round";
        ctx.lineTo(pos.x, pos.y); ctx.stroke();
        lastX = pos.x; lastY = pos.y;
    } else if (mode === "erase") {
        ctx.clearRect(pos.x-15, pos.y-15, 30, 30);
    }
});

canvas.addEventListener("touchend", e => {
    e.preventDefault();
    drawing = false;
    if (mode === "draw" || mode === "erase") saveState();
    if (mode === "addGeo") {
        const pos = getPos(e);
        navigator.geolocation.getCurrentPosition(geo => {
            const text = `📍 ${geo.coords.latitude.toFixed(5)}, ${geo.coords.longitude.toFixed(5)}`;
            ctx.font = "12px system-ui, sans-serif";
            const w = ctx.measureText(text).width + 16;
            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.fillRect(12, canvas.height - 40, w, 28);
            ctx.fillStyle = "#fff";
            ctx.fillText(text, 20, canvas.height - 18);
            saveState();
            showToast("Геотег слева");
        }, () => showToast("Гео недоступно"));
        mode = "draw";
    }
});

function setMode(m) { mode = m; }

function addGeo() {
    setMode("addGeo");
    showToast("Тапни — геотег слева");
}

function openModal() {
    document.getElementById("modal").style.display = "flex";
    const now = new Date();
    document.getElementById("titleInput").value = now.toISOString().slice(0,19).replace(/[:T]/g,"-");
    document.getElementById("descInput").value = "";
}

function closeModal() { document.getElementById("modal").style.display = "none"; }

function applyText() {
    const title = document.getElementById("titleInput").value.trim() || "Фото";
    const desc = document.getElementById("descInput").value.trim() || "";

    const current = canvas.toDataURL();
    const base = new Image();
    base.src = current;
    base.onload = () => {
        ctx.drawImage(base, 0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "rgba(0,0,0,0.65)";
        ctx.fillRect(canvas.width - 220, 20, 200, 140);

        ctx.fillStyle = "#fff";
        ctx.font = "bold 20px system-ui, sans-serif";
        ctx.fillText(title, canvas.width - 200, 50);

        ctx.font = "16px system-ui, sans-serif";
        ctx.fillText(desc, canvas.width - 200, 90);

        saveState();
        closeModal();
        showToast("Текст справа");
    };
}

function saveImage() {
    canvas.toBlob(blob => {
        const a = document.createElement("a");
        a.download = "photo.jpg";
        a.href = URL.createObjectURL(blob);
        a.click();
        showToast("Сохранено");
    }, "image/jpeg", 0.92);
}

function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.style.display = "block";
    setTimeout(() => t.style.display = "none", 2000);
}
</script>
</body>
</html>
