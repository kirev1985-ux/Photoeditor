<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Photo Editor STABLE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        canvas { display: block; background: #111; }
        .menu { position: fixed; bottom: 20px; width: 100%; display: flex; justify-content: center; gap: 20px; z-index: 10; }
        .btn { width: 60px; height: 60px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .side-btn { position: fixed; right: 10px; top: 20px; width: 50px; height: 50px; background: #333; color: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 10px; }
        #save-screen { position: fixed; top:0; left:0; width:100%; height:100%; background: #000; display:none; flex-direction:column; align-items:center; justify-content:center; z-index:100; }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="menu">
    <div class="btn" onclick="document.getElementById('fileInput').click()">📷</div>
    <div class="btn" onclick="location.reload()">🔄</div>
</div>

<div style="position:fixed; right:10px; top:20px; display:flex; flex-direction:column; gap:10px;">
    <div class="side-btn" onclick="addGPS()">📍</div>
    <div class="side-btn" onclick="addNote()">📝</div>
    <div class="side-btn" onclick="save()">💾</div>
</div>

<input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none" onchange="handleImage(this)">

<div id="save-screen" onclick="this.style.display='none'">
    <p style="color:white">ЗАЖМИ ФОТО ДЛЯ СОХРАНЕНИЯ</p>
    <img id="out-img" style="max-width:90%; border:1px solid white;">
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    function handleImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const ratio = Math.min(canvas.width / img.width, canvas.height / img.height);
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, img.width * ratio, img.height * ratio);
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    canvas.addEventListener('touchstart', (e) => { drawing = true; draw(e); });
    canvas.addEventListener('touchmove', (e) => { if(drawing) draw(e); e.preventDefault(); });
    canvas.addEventListener('touchend', () => { drawing = false; ctx.beginPath(); });

    function draw(e) {
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.strokeStyle = 'red';
        ctx.lineTo(e.touches[0].clientX, e.touches[0].clientY);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(e.touches[0].clientX, e.touches[0].clientY);
    }

    function addGPS() {
        navigator.geolocation.getCurrentPosition(p => {
            const text = "📍 " + p.coords.latitude.toFixed(6) + ", " + p.coords.longitude.toFixed(6);
            ctx.fillStyle = "rgba(0,0,0,0.5)";
            ctx.fillRect(10, canvas.height - 40, 250, 30);
            ctx.fillStyle = "white";
            ctx.font = "16px Arial";
            ctx.fillText(text, 20, canvas.height - 20);
        });
    }

    function addNote() {
        const note = prompt("Введите текст:");
        if(note) {
            ctx.fillStyle = "rgba(0,0,0,0.5)";
            ctx.fillRect(10, 20, canvas.width - 20, 30);
            ctx.fillStyle = "white";
            ctx.font = "16px Arial";
            ctx.fillText(note, 20, 40);
        }
    }

    function save() {
        document.getElementById('out-img').src = canvas.toDataURL();
        document.getElementById('save-screen').style.display = 'flex';
    }
</script>
</body>
</html>
