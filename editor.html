<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Редактор Foximbox</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin:0; overflow:hidden; background:#000; color:#fff; font-family:system-ui, sans-serif; }
    
    #canvas { width:100vw; height:100vh; touch-action:none; display:block; }
    
    /* Индикация активной кнопки */
    .active-tool { border: 2px solid #00ff00 !important; box-shadow: 0 0 10px #00ff00; }

    #toolbar { position:fixed; right:12px; top:12px; display:flex; flex-direction:column; gap:12px; z-index:100; }
    .btn { 
        width:48px; height:48px; background:rgba(30,30,30,0.9); 
        border:1px solid rgba(255,255,255,0.2); border-radius:12px; 
        font-size:24px; display:flex; justify-content:center; align-items:center; cursor:pointer; 
    }

    #bottomBar { position:fixed; bottom:25px; left:0; width:100%; display:flex; justify-content:center; align-items:center; gap:30px; z-index:90; }
    .bottom-btn { width:65px; height:65px; background:rgba(30,30,30,0.9); border:2px solid #fff; border-radius:50%; font-size:30px; display:flex; justify-content:center; align-items:center; }
    .bottom-btn.small { width:45px; height:45px; font-size:20px; border:1px solid #aaa; }

    /* Экран выбора опций */
    #saveMenu { 
        position:fixed; inset:0; background:rgba(0,0,0,0.95); 
        display:none; flex-direction:column; justify-content:center; align-items:center; z-index:300; padding:20px;
    }
    .menu-section { width:100%; max-width:300px; margin-bottom:25px; text-align:center; }
    .menu-grid { display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-top:10px; }
    .opt-btn { padding:15px; border-radius:10px; border:1px solid #444; background:#222; color:#fff; font-weight:bold; cursor:pointer; }
    .opt-btn.red { border-color: red; color: red; }
    .opt-btn.yellow { border-color: yellow; color: yellow; }

    #botBtn { 
        margin-top:30px; background:#0088cc; color:#fff; padding:15px 30px; 
        border-radius:30px; text-decoration:none; font-weight:bold; display:flex; align-items:center; gap:10px;
    }

    #toast { position:fixed; bottom:120px; left:50%; transform:translateX(-50%); background:#fff; color:#000; padding:8px 20px; border-radius:20px; display:none; z-index:400; font-weight:bold; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="toolbar">
    <label class="btn" for="galleryInput">🖼</label>
    <input type="file" accept="image/*" id="galleryInput" onchange="loadImage(this.files[0])">
    
    <div class="btn tool" id="btn-draw" onclick="setMode('draw')">✏️</div>
    <div class="btn tool" id="btn-hand" onclick="setMode('hand')">✋</div>
    <div class="btn tool" id="btn-erase" onclick="setMode('erase')">🧽</div>
    <div class="btn" onclick="addGeo()">📍</div>
    <div class="btn" onclick="openSaveMenu()">💾</div>
</div>

<div id="bottomBar">
    <div class="bottom-btn small" onclick="undo()">↩️</div>
    <label class="bottom-btn" for="cameraInput">📷</label>
    <input type="file" accept="image/*" capture="environment" id="cameraInput" onchange="loadImage(this.files[0])">
    <div class="bottom-btn small" onclick="redo()">↪️</div>
</div>

<div id="saveMenu">
    <h3>Настройка метки</h3>
    <div class="menu-section">
        <div>Цвет изо.</div>
        <div class="menu-grid">
            <div class="opt-btn red" onclick="setOption('color', 'Красная')">Красная</div>
            <div class="opt-btn yellow" onclick="setOption('color', 'Желтая')">Желтая</div>
        </div>
    </div>
    <div class="menu-section">
        <div>Тип</div>
        <div class="menu-grid">
            <div class="opt-btn" onclick="setOption('type', 'Тайник')">Тайник</div>
            <div class="opt-btn" onclick="setOption('type', 'Магнит')">Магнит</div>
        </div>
    </div>
    <button class="opt-btn" style="width:200px; background:#007bff;" onclick="applyOptions()">Применить и Сохранить</button>
    
    <a href="https://t.me/Foximboxf_bot" id="botBtn" target="_blank">📤 Отправить в бот</a>
    <button onclick="closeSaveMenu()" style="margin-top:20px; background:none; border:none; color:#888;">Закрыть</button>
</div>

<div id="toast"></div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let mode = "draw";
let imgObj = null;
let scale = 1, offsetX = 0, offsetY = 0;
let history = [], redoStack = [];
let currentOptions = { color: '', type: '' };

// Инициализация
function init() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.fillStyle = "#000";
    ctx.fillRect(0,0,canvas.width, canvas.height);
    setMode('draw');
    saveState();
}
window.addEventListener('resize', init);
init();

function setMode(m) {
    mode = m;
    document.querySelectorAll('.tool').forEach(b => b.classList.remove('active-tool'));
    document.getElementById('btn-' + m).classList.add('active-tool');
    showToast(m === 'hand' ? "Режим: Рука (Зум)" : (m === 'draw' ? "Режим: Рисование" : "Режим: Ластик"));
}

function loadImage(file) {
    if(!file) return;
    const reader = new FileReader();
    reader.onload = e => {
        imgObj = new Image();
        imgObj.onload = () => {
            scale = Math.min(canvas.width / imgObj.width, canvas.height / imgObj.height);
            offsetX = (canvas.width - imgObj.width * scale) / 2;
            offsetY = (canvas.height - imgObj.height * scale) / 2;
            render();
            saveState();
        };
        imgObj.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if(imgObj) {
        ctx.drawImage(imgObj, offsetX, offsetY, imgObj.width * scale, imgObj.height * scale);
    }
}

// Управление касаниями (Зум и Рисование)
let startX, startY, startDist;
canvas.addEventListener('touchstart', e => {
    const pos = getPos(e);
    if(mode === 'hand') {
        startX = pos.x - offsetX;
        startY = pos.y - offsetY;
        if(e.touches.length === 2) {
            startDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
        }
    } else {
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
    }
});

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const pos = getPos(e);
    if(mode === 'hand') {
        if(e.touches.length === 1) {
            offsetX = pos.x - startX;
            offsetY = pos.y - startY;
        } else if(e.touches.length === 2) {
            let dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            let zoom = dist / startDist;
            scale *= zoom;
            startDist = dist;
        }
        render();
    } else {
        if(mode === 'draw') {
            ctx.strokeStyle = "#ff3366"; ctx.lineWidth = 4; ctx.lineCap = "round";
            ctx.lineTo(pos.x, pos.y); ctx.stroke();
        } else if(mode === 'erase') {
            ctx.clearRect(pos.x-20, pos.y-20, 40, 40);
        }
    }
});

canvas.addEventListener('touchend', () => { if(mode !== 'hand') saveState(); });

function getPos(e) {
    const t = e.touches[0] || e.changedTouches[0];
    return { x: t.clientX, y: t.clientY };
}

// Гео и Опции
function addGeo() {
    navigator.geolocation.getCurrentPosition(geo => {
        const text = `📍 ${geo.coords.latitude.toFixed(6)}, ${geo.coords.longitude.toFixed(6)} ±${Math.round(geo.coords.accuracy)}м`;
        ctx.font = "12px sans-serif";
        ctx.fillStyle = "white";
        ctx.fillText(text, 15, canvas.height - 20);
        saveState();
    });
}

function openSaveMenu() { document.getElementById('saveMenu').style.display = 'flex'; }
function closeSaveMenu() { document.getElementById('saveMenu').style.display = 'none'; }

function setOption(key, val) {
    currentOptions[key] = val;
    showToast(val);
}

function applyOptions() {
    ctx.font = "bold 14px sans-serif";
    ctx.fillStyle = currentOptions.color === 'Красная' ? 'red' : 'yellow';
    ctx.fillText(`${currentOptions.color} | ${currentOptions.type}`, canvas.width - 180, 30);
    saveState();
    
    // Авто-скачивание
    const link = document.createElement('a');
    link.download = 'fox_photo.jpg';
    link.href = canvas.toDataURL("image/jpeg", 0.9);
    link.click();
    closeSaveMenu();
}

function saveState() {
    history.push(canvas.toDataURL());
    if(history.length > 10) history.shift();
}

function undo() {
    if(history.length > 1) {
        redoStack.push(history.pop());
        let img = new Image();
        img.onload = () => { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0); };
        img.src = history[history.length-1];
    }
}

function showToast(m) {
    const t = document.getElementById('toast');
    t.textContent = m; t.style.display = 'block';
    setTimeout(() => t.style.display='none', 1000);
}
</script>
</body>
</html>
