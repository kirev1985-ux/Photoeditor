<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Photo Editor Pro 16:9</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #viewport { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; touch-action: none; }
        canvas { background: #111; image-rendering: auto; }
        
        /* Панели управления */
        #toolbar { position: fixed; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 10px; z-index: 100; }
        .btn { width: 50px; height: 50px; background: rgba(30,30,30,0.9); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; font-size: 24px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .btn.active { border: 2px solid #00ff00; transform: scale(0.9); background: rgba(0,255,0,0.1); }

        #bottomBar { position: fixed; bottom: 20px; left: 0; width: 100%; display: flex; justify-content: center; align-items: center; gap: 35px; z-index: 100; }
        .bottom-btn { width: 60px; height: 60px; background: rgba(40,40,40,0.9); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; font-size: 28px; display: flex; justify-content: center; align-items: center; }

        /* Информационное табло (интерактив) */
        #liveGeo { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 8px; font-size: 10px; color: #aaa; pointer-events: none; z-index: 50; }

        #modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 200; }
        #modalBox { width: 85%; background: #1a1a1a; padding: 20px; border-radius: 15px; color: white; }
        input, textarea { width: 100%; margin: 10px 0; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; box-sizing: border-box; }
        input[type=file] { display: none; }
    </style>
</head>
<body>

<div id="liveGeo">GPS: Поиск спутников...</div>

<div id="viewport">
    <canvas id="canvas"></canvas>
</div>

<div id="toolbar">
    <label class="btn">📸<input type="file" accept="image/*" capture="environment" id="cameraInput"></label>
    <label class="btn">🖼<input type="file" accept="image/*" id="galleryInput"></label>
    <div class="btn" id="drawBtn" onclick="toggleMode('draw')">✏️</div>
    <div class="btn" id="eraseBtn" onclick="toggleMode('erase')">🧽</div>
    <div class="btn" onclick="addGeoWithAddress()">📍</div>
    <div class="btn" onclick="openModal()">📝</div>
    <div class="btn" onclick="saveImage()">💾</div>
</div>

<div id="bottomBar">
    <div class="bottom-btn" onclick="undo()">↩️</div>
    <div class="bottom-btn" onclick="triggerCamera()">📷</div>
    <div class="bottom-btn" onclick="redo()">↪️</div>
</div>

<div id="modal">
    <div id="modalBox">
        <h4 style="margin:0">Данные объекта</h4>
        <input id="titleInput" placeholder="Заголовок (например, Номер опоры)">
        <textarea id="descInput" rows="3" placeholder="Описание работ"></textarea>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button onclick="closeModal()" style="flex:1; padding:12px; background:#444; color:#fff; border:none; border-radius:8px;">Отмена</button>
            <button onclick="applyText()" style="flex:1; padding:12px; background:#007bff; color:#fff; border:none; border-radius:8px;">Нанести</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const liveGeoDiv = document.getElementById("liveGeo");
    
    let currentMode = 'view';
    let history = [], redoStack = [];
    let textBuffer = { title: "", desc: "" };
    let lastCoords = { lat: 0, lon: 0, acc: 0 };

    // Зум
    let scale = 1, posX = 0, posY = 0, lastPosX = 0, lastPosY = 0;

    function initCanvas() {
        const dpr = window.devicePixelRatio || 2;
        let w = window.innerWidth;
        let h = w * (16/9);
        if (h > window.innerHeight) { h = window.innerHeight; w = h * (9/16); }
        
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        
        ctx.scale(dpr, dpr);
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.lineWidth = 3;
        saveState();
        startGpsTracking();
    }

    // Интерактивное отслеживание GPS
    function startGpsTracking() {
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(p => {
                lastCoords = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy };
                liveGeoDiv.innerText = `GPS: ${lastCoords.lat.toFixed(5)}, ${lastCoords.lon.toFixed(5)} (±${lastCoords.acc.toFixed(0)}м)`;
            }, null, { enableHighAccuracy: true });
        }
    }

    function toggleMode(mode) {
        document.getElementById("drawBtn").classList.remove("active");
        document.getElementById("eraseBtn").classList.remove("active");
        if (currentMode === mode) {
            currentMode = 'view';
        } else {
            currentMode = mode;
            document.getElementById(mode + "Btn").classList.add("active");
        }
    }

    async function addGeoWithAddress() {
        const { lat, lon, acc } = lastCoords;
        let address = "Адрес не определен";

        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&addressdetails=1`, {
                headers: { 'Accept-Language': 'ru' }
            });
            const data = await response.json();
            if (data.address) {
                const a = data.address;
                address = `${a.city || a.town || a.village || ''}, ${a.road || ''} ${a.house_number || ''}`.trim().replace(/^,/, '');
            }
        } catch (e) { console.error("Ошибка геокодинга"); }

        drawInfoBlock(`📍 ${lat.toFixed(6)}, ${lon.toFixed(6)} (±${acc.toFixed(0)}м)`, address, 'bottom');
    }

    function applyText() {
        textBuffer.title = document.getElementById("titleInput").value;
        textBuffer.desc = document.getElementById("descInput").value;
        drawInfoBlock(textBuffer.title, textBuffer.desc, 'top');
        closeModal();
    }

    function drawInfoBlock(line1, line2, position) {
        const w = canvas.width / window.devicePixelRatio;
        const h = canvas.height / window.devicePixelRatio;
        const padding = 15;
        const rectHeight = 60;
        const y = (position === 'top') ? 10 : h - rectHeight - 10;

        ctx.globalCompositeOperation = "source-over";
        
        // Темная подложка
        ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
        ctx.roundRect ? ctx.fillRoundedRect(10, y, w - 20, rectHeight, 10) : ctx.fillRect(10, y, w - 20, rectHeight);
        ctx.fill();

        ctx.fillStyle = "white";
        ctx.textAlign = "left";
        ctx.shadowColor = "rgba(0,0,0,0.8)";
        ctx.shadowBlur = 4;

        // Линия 1 (Заголовок или Координаты)
        ctx.font = "bold 14px Arial";
        ctx.fillText(line1, 25, y + 25);

        // Линия 2 (Описание или Адрес)
        ctx.font = "12px Arial";
        ctx.fillText(line2, 25, y + 45);

        ctx.shadowBlur = 0;
        saveState();
    }

    // Canvas Polyfill для скругленных углов
    CanvasRenderingContext2D.prototype.fillRoundedRect = function(x, y, w, h, r) {
        this.beginPath();
        this.moveTo(x+r, y);
        this.arcTo(x+w, y, x+w, y+h, r);
        this.arcTo(x+w, y+h, x, y+h, r);
        this.arcTo(x, y+h, x, y, r);
        this.arcTo(x, y, x+w, y, r);
        this.closePath();
    };

    // Остальные системные функции (без изменений)
    function handleFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        const img = new Image();
        img.onload = () => {
            const cw = canvas.width / window.devicePixelRatio;
            const ch = canvas.height / window.devicePixelRatio;
            ctx.clearRect(0,0,cw,ch);
            const ratio = Math.max(cw/img.width, ch/img.height);
            ctx.drawImage(img, (cw-img.width*ratio)/2, (ch-img.height*ratio)/2, img.width*ratio, img.height*ratio);
            saveState();
            resetZoom();
        };
        img.src = URL.createObjectURL(file);
    }

    function resetZoom() { scale = 1; posX = 0; posY = 0; updateTransform(); }
    function updateTransform() { canvas.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`; }

    // Тач-события
    viewport.addEventListener('touchstart', e => {
        if (currentMode !== 'view' && e.touches.length === 1) {
            ctx.beginPath();
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width / window.devicePixelRatio);
            const y = (e.touches[0].clientY - rect.top) * (canvas.height / rect.height / window.devicePixelRatio);
            ctx.moveTo(x, y);
        }
        lastPosX = e.touches[0].clientX - posX; lastPosY = e.touches[0].clientY - posY;
    });

    viewport.addEventListener('touchmove', e => {
        if (currentMode !== 'view' && e.touches.length === 1) {
            ctx.globalCompositeOperation = (currentMode === 'erase') ? "destination-out" : "source-over";
            ctx.strokeStyle = "red";
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width / window.devicePixelRatio);
            const y = (e.touches[0].clientY - rect.top) * (canvas.height / rect.height / window.devicePixelRatio);
            ctx.lineTo(x, y); ctx.stroke();
        } else if (currentMode === 'view') {
            posX = e.touches[0].clientX - lastPosX; posY = e.touches[0].clientY - lastPosY;
            updateTransform();
        }
    });

    viewport.addEventListener('touchend', () => { if(currentMode !== 'view') saveState(); });

    function saveState() {
        const data = canvas.toDataURL();
        if (history.length > 0 && history[history.length-1] === data) return;
        history.push(data);
        if (history.length > 15) history.shift();
    }

    function undo() {
        if (history.length > 1) {
            redoStack.push(history.pop());
            const img = new Image();
            img.onload = () => {
                const cw = canvas.width / window.devicePixelRatio;
                const ch = canvas.height / window.devicePixelRatio;
                ctx.clearRect(0,0,cw,ch);
                ctx.drawImage(img, 0, 0, cw, ch);
            };
            img.src = history[history.length-1];
        }
    }

    function saveImage() {
        resetZoom();
        setTimeout(() => {
            const link = document.createElement('a');
            link.download = `IMG_${Date.now()}.png`;
            link.href = canvas.toDataURL("image/png", 1.0);
            link.click();
        }, 200);
    }

    function openModal() { 
        document.getElementById("titleInput").value = textBuffer.title;
        document.getElementById("descInput").value = textBuffer.desc;
        document.getElementById("modal").style.display = "flex"; 
    }
    function closeModal() { document.getElementById("modal").style.display = "none"; }
    function triggerCamera() { document.getElementById("cameraInput").click(); }

    document.getElementById("cameraInput").onchange = handleFile;
    document.getElementById("galleryInput").onchange = handleFile;
    window.onload = initCanvas;
</script>
</body>
</html>
