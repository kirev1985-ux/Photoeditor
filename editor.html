<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Фоторедактор</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body { margin:0; overflow:hidden; background:#000; font-family:system-ui, sans-serif; color:#fff; }
    #canvas { width:100vw; height:100vh; touch-action:none; background:#000; display:block; }
    #toolbar {
        position:fixed; right:16px; top:16px; display:flex; flex-direction:column; gap:16px; z-index:100;
    }
    .btn {
        width:60px; height:60px; background:rgba(30,30,30,0.8); border:1px solid rgba(255,255,255,0.3);
        border-radius:16px; font-size:32px; display:flex; justify-content:center; align-items:center;
        cursor:pointer; user-select:none; backdrop-filter:blur(8px);
    }
    .btn:active { background:rgba(80,80,80,0.9); transform:scale(0.95); }
    input[type=file] { display:none; }
    #bottomBar {
        position:fixed; bottom:32px; left:0; width:100%; display:flex; justify-content:center; gap:60px; z-index:90;
    }
    .bottom-btn {
        width:68px; height:68px; background:rgba(30,30,30,0.85); border:1px solid rgba(255,255,255,0.35);
        border-radius:50%; font-size:34px; display:flex; justify-content:center; align-items:center;
        user-select:none; backdrop-filter:blur(10px);
    }
    #modal {
        position:fixed; inset:0; background:rgba(0,0,0,0.92); display:none; justify-content:center; align-items:center; z-index:200;
    }
    #modalBox {
        width:90%; max-width:440px; background:#1a1a1a; padding:28px; border-radius:20px; border:1px solid #444;
    }
    #modalBox input, #modalBox textarea {
        width:100%; margin:14px 0 10px; padding:14px; border-radius:12px; border:1px solid #555;
        background:#222; color:#fff; font-size:18px;
    }
    #modalButtons { margin-top:24px; display:flex; gap:16px; }
    #modalButtons button { flex:1; padding:16px; border-radius:12px; font-size:18px; cursor:pointer; }
    #cancelBtn { background:#444; color:#fff; border:none; }
    #okBtn     { background:#0066ff; color:#fff; border:none; }
    #toast {
        position:fixed; bottom:140px; left:50%; transform:translateX(-50%);
        background:rgba(0,0,0,0.9); padding:16px 28px; border-radius:16px; font-size:18px;
        backdrop-filter:blur(8px); display:none; z-index:150;
    }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="toolbar">
    <label class="btn">📸<input type="file" accept="image/*" capture="environment" id="cameraInput"></label>
    <label class="btn">🖼<input type="file" accept="image/*" id="galleryInput"></label>
    <div class="btn" onclick="setMode('draw')">✏️</div>
    <div class="btn" onclick="setMode('erase')">🧽</div>
    <div class="btn" onclick="startCrop()">✂️</div>
    <div class="btn" onclick="addGeo()">📍</div>
    <div class="btn" onclick="openModal()">📝</div>
    <div class="btn" onclick="saveImage()">💾</div>
</div>

<div id="bottomBar">
    <div class="bottom-btn" id="undoBtn">↩️</div>
    <div class="bottom-btn" onclick="triggerCamera()">📸</div>
    <div class="bottom-btn" id="redoBtn">↪️</div>
</div>

<div id="modal">
    <div id="modalBox">
        <label>Название</label>
        <input id="titleInput" placeholder="Название фото">

        <label>Описание</label>
        <textarea id="descInput" rows="5" placeholder="Что на фото?"></textarea>

        <div id="modalButtons">
            <button id="cancelBtn" onclick="closeModal()">Отмена</button>
            <button id="okBtn" onclick="applyText()">OK</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let mode = "draw";
let drawing = false;
let lastX, lastY;
let history = [];
let redoStack = [];
let currentImage = new Image();

function resizeCanvas() {
    const data = canvas.toDataURL("image/jpeg", 0.92);
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    if (data !== "data:,") {
        const img = new Image();
        img.src = data;
        img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    }
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

function saveState() {
    history.push(canvas.toDataURL("image/jpeg", 0.92));
    redoStack = [];
}

function loadState(url) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    img.src = url;
}

function undo() {
    if (history.length > 1) {
        redoStack.push(history.pop());
        loadState(history[history.length - 1]);
    }
}

function redo() {
    if (redoStack.length > 0) {
        const state = redoStack.pop();
        history.push(state);
        loadState(state);
    }
}

document.getElementById("undoBtn").onclick = undo;
document.getElementById("redoBtn").onclick = redo;

function loadImage(file) {
    const reader = new FileReader();
    reader.onload = e => {
        currentImage.onload = () => {
            const ratio = Math.min(canvas.width / currentImage.width, canvas.height / currentImage.height);
            const w = currentImage.width * ratio;
            const h = currentImage.height * ratio;
            const x = (canvas.width - w) / 2;
            const y = (canvas.height - h) / 2;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(currentImage, x, y, w, h);
            saveState();
        };
        currentImage.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

document.getElementById("cameraInput").onchange = e => loadImage(e.target.files[0]);
document.getElementById("galleryInput").onchange = e => loadImage(e.target.files[0]);

function triggerCamera() { document.getElementById("cameraInput").click(); }

function getPos(e) {
    const touch = e.touches?.[0] || e.changedTouches?.[0] || e;
    const r = canvas.getBoundingClientRect();
    return { x: touch.clientX - r.left, y: touch.clientY - r.top };
}

canvas.addEventListener("touchstart", e => {
    e.preventDefault();
    const pos = getPos(e);
    drawing = true;
    lastX = pos.x; lastY = pos.y;
    if (mode === "draw" || mode === "erase") {
        ctx.beginPath(); ctx.moveTo(lastX, lastY);
    }
});

canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    if (!drawing) return;
    const pos = getPos(e);
    if (mode === "draw") {
        ctx.strokeStyle = "#ff3366"; ctx.lineWidth = 6; ctx.lineCap = "round";
        ctx.moveTo(lastX, lastY); ctx.lineTo(pos.x, pos.y); ctx.stroke();
        lastX = pos.x; lastY = pos.y;
    } else if (mode === "erase") {
        ctx.clearRect(pos.x-20, pos.y-20, 40, 40);
    }
});

canvas.addEventListener("touchend", e => {
    e.preventDefault();
    drawing = false;
    if (mode === "addGeo") {
        const pos = getPos(e);
        navigator.geolocation.getCurrentPosition(geo => {
            const lat = geo.coords.latitude.toFixed(6);
            const lon = geo.coords.longitude.toFixed(6);
            const acc = Math.round(geo.coords.accuracy);
            const text = `📍 ${lat}, ${lon}`;
            const accText = acc > 0 ? ` ±${acc}м` : '';

            const fontSize = 20;
            const padding = 12;
            const w = ctx.measureText(text + accText).width + padding*2;
            const h = 44;

            let x = pos.x - w/2;
            let y = pos.y - h/2;

            ctx.fillStyle = "rgba(0,0,0,0.75)";
            ctx.fillRect(x, y, w, h);

            ctx.fillStyle = "#fff";
            ctx.font = `bold ${fontSize}px system-ui, sans-serif`;
            ctx.fillText(text + accText, x + padding, y + 32);

            saveState();
            showToast("Геотег поставлен");
            mode = "draw";
        }, err => showToast("Гео не удалось: " + err.message), {enableHighAccuracy: true});
    } else if (mode === "draw" || mode === "erase") {
        saveState();
    }
});

function setMode(m) { mode = m; }

function addGeo() {
    setMode("addGeo");
    showToast("Тапни куда ставить геотег");
}

function openModal() {
    document.getElementById("modal").style.display = "flex";
    const now = new Date();
    document.getElementById("titleInput").value = now.toISOString().slice(0,19).replace(/[:T]/g,"-");
    document.getElementById("descInput").value = "";
}

function closeModal() { document.getElementById("modal").style.display = "none"; }

function applyText() {
    const title = document.getElementById("titleInput").value.trim() || "Фото";
    const desc = document.getElementById("descInput").value.trim() || "";

    const current = canvas.toDataURL("image/jpeg", 0.92);
    const base = new Image();
    base.src = current;
    base.onload = () => {
        ctx.drawImage(base, 0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.fillRect(24, 24, canvas.width - 48, 160);

        ctx.fillStyle = "#fff";
        ctx.font = "bold 32px system-ui, sans-serif";
        ctx.fillText(title, 48, 70);

        ctx.font = "24px system-ui, sans-serif";
        wrapText(ctx, desc, 48, 110, canvas.width - 96, 30);

        saveState();
        closeModal();
        showToast("Описание добавлено");
    };
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
            ctx.fillText(line, x, y);
            line = words[n] + ' ';
            y += lineHeight;
        } else {
            line = testLine;
        }
    }
    ctx.fillText(line, x, y);
}

function saveImage() {
    const title = document.getElementById("titleInput").value.trim() || "photo";
    canvas.toBlob(blob => {
        const a = document.createElement("a");
        a.download = title + ".jpg";
        a.href = URL.createObjectURL(blob);
        a.click();
        showToast("Сохранено как " + title + ".jpg");
    }, "image/jpeg", 0.94);
}

function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.style.display = "block";
    setTimeout(() => t.style.display = "none", 2200);
}
</script>
</body>
</html>
