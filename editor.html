<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Редактор фото</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: sans-serif;
        color: #fff;
    }

    #canvas {
        width: 100vw;
        height: 100vh;
        touch-action: none;
        background: #000;
    }

    /* Правая панель */
    #toolbar {
        position: fixed;
        right: 10px;
        top: 10px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        z-index: 10;
    }

    .btn {
        width: 55px;
        height: 55px;
        background: rgba(0,0,0,0.35);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 12px;
        font-size: 28px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        user-select: none;
    }

    .btn:active {
        background: rgba(255,255,255,0.25);
    }

    input[type=file] {
        display: none;
    }

    /* Нижняя панель — строго по центру */
    #bottomBar {
        position: fixed;
        bottom: 15px;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 32px;
        z-index: 20;
    }

    .bottom-btn {
        width: 65px;
        height: 65px;
        background: rgba(0,0,0,0.45);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 50%;
        font-size: 32px;
        display: flex;
        justify-content: center;
        align-items: center;
        user-select: none;
    }

    .bottom-btn:active {
        background: rgba(255,255,255,0.25);
    }

    /* Модальное окно (вариант B, тёмное) */
    #modal {
        position: fixed;
        top: 0; left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0,0,0,0.8);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 50;
    }

    #modalBox {
        width: 85%;
        background: rgba(0,0,0,0.8);
        padding: 20px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.2);
    }

    #modalBox label {
        font-size: 16px;
    }

    #modalBox input,
    #modalBox textarea {
        width: 100%;
        margin-top: 6px;
        margin-bottom: 10px;
        padding: 10px;
        border-radius: 8px;
        border: none;
        font-size: 16px;
        box-sizing: border-box;
    }

    #modalButtons {
        margin-top: 8px;
        display: flex;
        justify-content: space-between;
        gap: 10px;
    }

    #modalButtons button {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        border: none;
        font-size: 16px;
        cursor: pointer;
    }

    #modalButtons button:first-child {
        background: #555;
        color: #fff;
    }

    #modalButtons button:last-child {
        background: #00aaff;
        color: #fff;
    }

    /* Тост "Сохранено" */
    #toast {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.8);
        padding: 12px 20px;
        border-radius: 10px;
        font-size: 16px;
        display: none;
        z-index: 100;
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<!-- Правая панель -->
<div id="toolbar">
    <label class="btn">📸<input type="file" accept="image/*" capture="environment" id="cameraInput"></label>
    <label class="btn">🖼<input type="file" accept="image/*" id="galleryInput"></label>
    <div class="btn" onclick="setMode('draw')">✏️</div>
    <div class="btn" onclick="setMode('erase')">🧽</div>
    <div class="btn" onclick="startCrop()">✂️</div>
    <div class="btn" onclick="addGeo()">📍</div>
    <div class="btn" onclick="openModal()">📝</div>
    <div class="btn" onclick="saveImage()">💾</div>
</div>

<!-- Нижняя панель -->
<div id="bottomBar">
    <div class="bottom-btn" id="undoBtn">↩️</div>
    <div class="bottom-btn" onclick="triggerCamera()">📸</div>
    <div class="bottom-btn" id="redoBtn">↪️</div>
</div>

<!-- Модальное окно Название + Описание -->
<div id="modal">
    <div id="modalBox">
        <label>Название:</label>
        <input id="titleInput">

        <label>Описание:</label>
        <textarea id="descInput" rows="4"></textarea>

        <div id="modalButtons">
            <button onclick="closeModal()">Отмена</button>
            <button onclick="applyText()">OK</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let mode = "draw";
let drawing = false;
let startX = 0;
let startY = 0;

let history = [];
let redoStack = [];

function resizeCanvas() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const snapshot = canvas.toDataURL();
    canvas.width = w;
    canvas.height = h;
    if (snapshot) {
        const img = new Image();
        img.src = snapshot;
        img.onload = () => {
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        };
    }
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

function pushHistory() {
    history.push(canvas.toDataURL());
    redoStack = [];
}

function undo() {
    if (history.length > 1) {
        redoStack.push(history.pop());
        const img = new Image();
        img.src = history[history.length - 1];
        img.onload = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        };
    }
}

function redo() {
    if (redoStack.length > 0) {
        const data = redoStack.pop();
        history.push(data);
        const img = new Image();
        img.src = data;
        img.onload = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        };
    }
}

document.getElementById("undoBtn").onclick = undo;
document.getElementById("redoBtn").onclick = redo;

let undoHoldTimer = null;
document.getElementById("undoBtn").addEventListener("touchstart", () => {
    undoHoldTimer = setTimeout(() => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        history = [];
        redoStack = [];
    }, 600);
});
document.getElementById("undoBtn").addEventListener("touchend", () => {
    clearTimeout(undoHoldTimer);
});

function loadImage(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
        const img = new Image();
        img.onload = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            pushHistory();
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

document.getElementById("cameraInput").onchange = e => loadImage(e.target.files[0]);
document.getElementById("galleryInput").onchange = e => loadImage(e.target.files[0]);

function triggerCamera() {
    document.getElementById("cameraInput").click();
}
