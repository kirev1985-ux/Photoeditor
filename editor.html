<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Photo Report Light</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; color: white; }
        #viewport { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; touch-action: none; }
        canvas { background: #111; touch-action: none; display: block; }
        
        #toolbar { position: fixed; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 10px; z-index: 100; }
        .btn { width: 52px; height: 52px; background: rgba(30,30,30,0.9); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; font-size: 24px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .btn.active { border: 2px solid #00ff00; background: rgba(0,255,0,0.2); }

        #bottomBar { position: fixed; bottom: 20px; left: 0; width: 100%; display: flex; justify-content: center; align-items: center; gap: 30px; z-index: 100; }
        .bottom-btn { width: 62px; height: 62px; background: rgba(40,40,40,0.9); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; font-size: 28px; display: flex; justify-content: center; align-items: center; }

        #modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 200; }
        #modalBox { width: 85%; background: #1a1a1a; padding: 20px; border-radius: 15px; }
        input, textarea { width: 100%; margin: 10px 0; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="viewport">
    <canvas id="canvas"></canvas>
</div>

<div id="toolbar">
    <label class="btn">📸<input type="file" accept="image/*" capture="environment" id="cameraInput" onchange="handleFile(this)"></label>
    <div class="btn" id="drawBtn" onclick="toggleMode('draw')">✏️</div>
    <div class="btn" id="geoBtn" onclick="addOnlyCoords()">📍</div>
    <div class="btn" id="textBtn" onclick="openModal()">📝</div>
    <div class="btn" onclick="saveImage()">💾</div>
</div>

<div id="bottomBar">
    <div class="bottom-btn" onclick="safeUndo()">↩️</div>
    <div class="bottom-btn" onclick="document.getElementById('cameraInput').click()">📷</div>
    <div class="bottom-btn" onclick="location.reload()">🔄</div>
</div>

<div id="modal">
    <div id="modalBox">
        <input id="titleInput" placeholder="Заголовок (например, Опора №)">
        <textarea id="descInput" rows="3" placeholder="Описание работ"></textarea>
        <div style="display:flex; gap:10px;">
            <button onclick="closeModal()" style="flex:1; padding:12px;">Отмена</button>
            <button onclick="applyText()" style="flex:1; padding:12px; background:#007bff; color:white;">ОК</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let history = [], currentMode = 'view';
    let lastImg = null;

    function initCanvas() {
        const w = window.innerWidth * 0.95;
        const h = w * (16/9);
        canvas.width = w * 2; canvas.height = h * 2;
        canvas.style.width = w + "px"; canvas.style.height = h + "px";
        ctx.scale(2, 2);
        ctx.fillStyle = "#1a1a1a"; ctx.fillRect(0,0,w,h);
        saveState();
    }

    function handleFile(input) {
        const file = input.files[0];
        if (!file) return;
        const img = new Image();
        img.onload = () => {
            const cw = canvas.width / 2, ch = canvas.height / 2;
            ctx.clearRect(0,0,cw,ch);
            const ratio = Math.max(cw/img.width, ch/img.height);
            ctx.drawImage(img, (cw - img.width*ratio)/2, (ch - img.height*ratio)/2, img.width*ratio, img.height*ratio);
            lastImg = img;
            saveState();
        };
        img.src = URL.createObjectURL(file);
    }

    // ТЕПЕРЬ ТОЛЬКО КООРДИНАТЫ БЕЗ АДРЕСА (БЫСТРО И БЕЗ ГЛЮКОВ)
    function addOnlyCoords() {
        navigator.geolocation.getCurrentPosition((p) => {
            const txt = `📍 ${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)} (±${p.coords.accuracy.toFixed(0)}m)`;
            drawStaticBlock(txt, new Date().toLocaleString(), 'bottom');
        }, (err) => alert("Включите GPS"), { enableHighAccuracy: true, timeout: 5000 });
    }

    function applyText() {
        const t = document.getElementById("titleInput").value;
        const d = document.getElementById("descInput").value;
        drawStaticBlock(t, d, 'top');
        closeModal();
    }

    function drawStaticBlock(t1, t2, pos) {
        const cw = canvas.width/2, ch = canvas.height/2;
        const y = (pos === 'top') ? 20 : ch - 85;
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(10, y, cw - 20, 65);
        ctx.fillStyle = "white";
        ctx.font = "bold 14px Arial"; ctx.fillText(t1, 20, y + 25);
        ctx.font = "12px Arial"; ctx.fillText(t2, 20, y + 48);
        saveState();
    }

    function saveImage() {
        const data = canvas.toDataURL("image/png");
        const link = document.createElement('a');
        link.href = data;
        link.download = `IMG_${Date.now()}.png`;
        link.click();
    }

    function toggleMode(m) { 
        currentMode = (currentMode === m) ? 'view' : m;
        document.getElementById("drawBtn").classList.toggle("active", currentMode === 'draw');
    }

    function saveState() { history.push(canvas.toDataURL()); if(history.length > 10) history.shift(); }
    function safeUndo() {
        if(history.length > 1) {
            history.pop();
            const img = new Image();
            img.onload = () => { ctx.clearRect(0,0,canvas.width/2,canvas.height/2); ctx.drawImage(img,0,0,canvas.width/2,canvas.height/2); };
            img.src = history[history.length-1];
        }
    }

    // Рисование
    canvas.addEventListener('touchmove', e => {
        if (currentMode !== 'draw') return;
        const r = canvas.getBoundingClientRect();
        const x = (e.touches[0].clientX - r.left) * (canvas.width/r.width/2);
        const y = (e.touches[0].clientY - r.top) * (canvas.height/r.height/2);
        ctx.fillStyle = "red"; ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
    });

    function openModal() { document.getElementById("modal").style.display = "flex"; }
    function closeModal() { document.getElementById("modal").style.display = "none"; }
    
    window.onload = initCanvas;
</script>
</body>
</html>
