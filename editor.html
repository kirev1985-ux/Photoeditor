<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PhotoEditor v2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #000; font-family: sans-serif; overflow: hidden; color: white; touch-action: none; }
        canvas { display: block; background: #111; margin: 0 auto; }
        #gps-live { position: fixed; top: 0; left: 0; width: 100%; background: rgba(0,0,0,0.8); color: #0f0; font-size: 11px; padding: 5px; text-align: center; z-index: 20; border-bottom: 1px solid #333; }
        #side-menu { position: fixed; right: 10px; top: 50px; display: flex; flex-direction: column; gap: 12px; z-index: 10; }
        .btn-side { width: 52px; height: 52px; background: #333; border: 1px solid #555; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        #bottom-menu { position: fixed; bottom: 30px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 30px; z-index: 10; }
        .btn-cam { width: 80px; height: 80px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; border: 5px solid #444; color: #000; }
        .btn-round { width: 55px; height: 55px; background: #444; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        #modal-iso, #save-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        .iso-btn { width: 250px; padding: 20px; margin: 10px; border-radius: 15px; font-weight: bold; text-align: center; border: 3px solid transparent; }
        .red-iso { background: #600; border-color: red; }
        .yellow-iso { background: #660; border-color: yellow; }
        #save-img { max-width: 90%; max-height: 70%; border: 1px solid #fff; }
    </style>
</head>
<body>

<div id="gps-live">Ожидание GPS...</div>
<canvas id="canvas"></canvas>

<div id="side-menu">
    <div class="btn-side" onclick="stampGPS()">📍</div>
    <div class="btn-side" onclick="updateNote()">📝</div>
    <div class="btn-side" onclick="showIsoMenu()">💾</div>
</div>

<div id="bottom-menu">
    <div class="btn-round" onclick="undo()">↩️</div>
    <div class="btn-cam" onclick="document.getElementById('hiddenInput').click()">📷</div>
    <div class="btn-round" onclick="location.reload()">🔄</div>
</div>

<div id="modal-iso">
    <div class="iso-btn red-iso" onclick="finalizeSave('КРАСНАЯ ИЗО', 'red')">КРАСНАЯ ИЗО</div>
    <div class="iso-btn yellow-iso" onclick="finalizeSave('ЖЕЛТАЯ ИЗО', 'yellow')">ЖЕЛТАЯ ИЗО</div>
    <div style="padding: 10px;" onclick="document.getElementById('modal-iso').style.display='none'">ОТМЕНА</div>
</div>

<input type="file" id="hiddenInput" accept="image/*" capture="environment" style="display:none" onchange="loadPhoto(this)">

<div id="save-screen" onclick="this.style.display='none'">
    <p>ЗАЖМИ ДЛЯ СОХРАНЕНИЯ</p>
    <img id="save-img">
</div>

<script>
    const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    let history = [], currentNote = "", lastGPS = { lat: 0, lon: 0, acc: 0 };
    let baseImage = null, drawing = false, lastX = 0, lastY = 0;

    window.onload = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        ctx.fillStyle = '#111'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        navigator.geolocation.watchPosition(p => {
            lastGPS = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy };
            document.getElementById('gps-live').innerText = `Координаты: ${lastGPS.lat.toFixed(6)}, ${lastGPS.lon.toFixed(6)} (±${lastGPS.acc.toFixed(1)}м)`;
        }, null, { enableHighAccuracy: true });
        saveStep();
    };

    function loadPhoto(input) {
        if (!input.files[0]) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                baseImage = img;
                render();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
    }

    function render() {
        if (!baseImage) return;
        const ratio = Math.min(canvas.width / baseImage.width, (canvas.height - 40) / baseImage.height);
        const w = baseImage.width * ratio, h = baseImage.height * ratio;
        ctx.clearRect(0,0, canvas.width, canvas.height);
        ctx.fillStyle = "#000"; ctx.fillRect(0,0, canvas.width, canvas.height);
        ctx.drawImage(baseImage, (canvas.width - w)/2, (canvas.height - h)/2, w, h);
        
        if (currentNote) {
            ctx.font = "16px Arial";
            const words = currentNote.split(' '), lines = []; let line = '';
            for (let n = 0; n < words.length; n++) {
                let test = line + words[n] + ' ';
                if (ctx.measureText(test).width > canvas.width - 40 && n > 0) { lines.push(line); line = words[n] + ' '; }
                else { line = test; }
            }
            lines.push(line);
            const lineH = 22, boxH = lines.length * lineH + 15;
            const yPos = 40; // Рисуем описание сверху
            ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, yPos, canvas.width, boxH);
            ctx.fillStyle = "white"; ctx.textAlign = "center";
            lines.forEach((l, i) => ctx.fillText(l, canvas.width/2, yPos + 22 + (i*lineH)));
            ctx.textAlign = "left";
        }
    }

    canvas.addEventListener('touchstart', e => { 
        drawing = true; 
        lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; 
    });
    canvas.addEventListener('touchmove', e => {
        if (!drawing) return; e.preventDefault();
        ctx.strokeStyle = "red"; ctx.lineWidth = 4; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(lastX, lastY); 
        ctx.lineTo(e.touches[0].clientX, e.touches[0].clientY); ctx.stroke();
        lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    });
    canvas.addEventListener('touchend', () => { drawing = false; saveStep(); });

    function stampGPS() {
        const txt = `📍 ${lastGPS.lat.toFixed(6)}, ${lastGPS.lon.toFixed(6)}`;
        ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(0, 0, canvas.width, 40);
        ctx.fillStyle = "white"; ctx.font = "18px Arial"; ctx.textAlign = "center";
        ctx.fillText(txt, canvas.width/2, 28);
        ctx.textAlign = "left"; saveStep();
    }

    function updateNote() {
        const n = prompt("Описание (перенос строк работает):", currentNote);
        if (n !== null) { currentNote = n; render(); saveStep(); }
    }

    function showIsoMenu() { document.getElementById('modal-iso').style.display = 'flex'; }

    function finalizeSave(label, color) {
        ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(10, 80, 160, 35);
        ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.strokeRect(10, 80, 160, 35);
        ctx.fillStyle = color; ctx.font = "bold 14px Arial"; ctx.textAlign = "center";
        ctx.fillText(label, 90, 103); ctx.textAlign = "left";
        document.getElementById('modal-iso').style.display = 'none';
        document.getElementById('save-img').src = canvas.toDataURL("image/png");
        document.getElementById('save-screen').style.display = 'flex';
    }

    function saveStep() { history.push(canvas.toDataURL()); if(history.length > 20) history.shift(); }
    function undo() { 
        if(history.length > 1) { 
            history.pop(); const i = new Image(); 
            i.onload = () => { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(i,0,0); }; 
            i.src = history[history.length-1]; 
        } 
    }
</script>
</body>
</html>
