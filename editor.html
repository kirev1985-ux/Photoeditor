<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Фоторедактор PRO + Точность</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
    * { box-sizing: border-box; }
    body { margin:0; overflow:hidden; background:#1a1a1a; color:#fff; font-family:system-ui, sans-serif; }
    
    #canvas { width:100vw; height:100vh; touch-action:none; display:block; background:#000; }
    
    /* Правая панель инструментов */
    #toolbar { 
        position:fixed; right:10px; top:10px; 
        display:flex; flex-direction:column; gap:12px; 
        z-index:100; padding:5px;
    }
    .btn { 
        width:46px; height:46px; background:rgba(45,45,45,0.9); 
        border:1px solid rgba(255,255,255,0.2); border-radius:12px; 
        font-size:22px; display:flex; justify-content:center; align-items:center; 
        cursor:pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    input[type=file] { display:none; }

    /* Нижняя панель */
    #bottomBar { 
        position:fixed; bottom:25px; left:0; width:100%; 
        display:flex; justify-content:center; align-items:center; gap:35px; z-index:90; 
    }
    .bottom-btn { 
        width:65px; height:65px; background:rgba(45,45,45,0.9); 
        border:2px solid #fff; border-radius:50%; 
        font-size:30px; display:flex; justify-content:center; align-items:center; 
    }
    .bottom-btn.small { 
        width:45px; height:45px; font-size:20px; 
        background:rgba(60,60,60,0.8); border:1px solid rgba(255,255,255,0.4); 
    }

    /* Модалка */
    #modal { position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none; justify-content:center; align-items:center; z-index:200; }
    #modalBox { width:85%; max-width:350px; background:#222; padding:20px; border-radius:15px; border:1px solid #444; }
    #modalBox input, #modalBox textarea { 
        width:100%; margin-bottom:15px; padding:12px; border-radius:8px; 
        border:1px solid #555; background:#111; color:#fff; font-size:14px; 
    }
    #modalButtons { display:flex; gap:10px; }
    #modalButtons button { flex:1; padding:12px; border-radius:8px; border:none; font-weight:bold; }
    #okBtn { background:#007bff; color:#fff; }
    #cancelBtn { background:#444; color:#fff; }

    #toast { 
        position:fixed; bottom:110px; left:50%; transform:translateX(-50%); 
        background:rgba(255,255,255,0.9); color:#000; padding:8px 15px; 
        border-radius:20px; font-size:13px; font-weight:bold; display:none; z-index:150; 
    }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="toolbar">
    <label class="btn">🖼<input type="file" accept="image/*" id="galleryInput"></label>
    <div class="btn" onclick="setMode('draw')">✏️</div>
    <div class="btn" onclick="setMode('erase')">🧽</div>
    <div class="btn" onclick="addGeo()">📍</div>
    <div class="btn" onclick="openModal()">📝</div>
    <div class="btn" onclick="saveImage()">💾</div>
</div>

<div id="bottomBar">
    <div class="bottom-btn small" id="undoBtn">↩️</div>
    <div class="bottom-btn" onclick="triggerCamera()">📷<input type="file" accept="image/*" capture="environment" id="cameraInput"></div>
    <div class="bottom-btn small" id="redoBtn">↪️</div>
</div>

<div id="modal">
    <div id="modalBox">
        <input id="titleInput" placeholder="Заголовок">
        <textarea id="descInput" rows="3" placeholder="Описание"></textarea>
        <div id="modalButtons">
            <button id="cancelBtn" onclick="closeModal()">Отмена</button>
            <button id="okBtn" onclick="applyText()">OK</button>
        </div>
    </div>
</div>

<div id="toast"></div>

    ctx.fillRect(0,0,canvas.width, canvas.height);
    saveState();
}

    img.onload = () => ctx.drawImage(img,0,0);
    img.src = backup;
});
