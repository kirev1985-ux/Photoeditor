<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Редактор фото</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body { margin:0; overflow:hidden; background:#000; font-family:sans-serif; color:#fff; }
    #canvas { width:100vw; height:100vh; touch-action:none; background:#000; display:block; }
    #toolbar {
        position:fixed; right:12px; top:12px; display:flex; flex-direction:column; gap:14px; z-index:10;
    }
    .btn {
        width:58px; height:58px; background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.2);
        border-radius:14px; font-size:30px; display:flex; justify-content:center; align-items:center;
        cursor:pointer; user-select:none; transition:background 0.15s;
    }
    .btn:active { background:rgba(255,255,255,0.3); }
    input[type=file] { display:none; }
    #bottomBar {
        position:fixed; bottom:20px; left:0; width:100%; display:flex; justify-content:center; gap:40px; z-index:20;
    }
    .bottom-btn {
        width:70px; height:70px; background:rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.25);
        border-radius:50%; font-size:34px; display:flex; justify-content:center; align-items:center; user-select:none;
    }
    #modal {
        position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none; justify-content:center; align-items:center; z-index:50;
    }
    #modalBox {
        width:88%; max-width:420px; background:#111; padding:24px; border-radius:16px; border:1px solid #333;
    }
    #modalBox input, #modalBox textarea {
        width:100%; margin:12px 0 8px; padding:12px; border-radius:10px; border:1px solid #444;
        background:#1a1a1a; color:white; font-size:18px;
    }
    #modalButtons { margin-top:20px; display:flex; gap:12px; }
    #modalButtons button { flex:1; padding:14px; border-radius:10px; font-size:18px; cursor:pointer; }
    #cancelBtn { background:#333; color:white; border:none; }
    #okBtn     { background:#0066ff; color:white; border:none; }
    #toast {
        position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
        background:rgba(0,0,0,0.85); padding:14px 24px; border-radius:12px; font-size:18px; display:none; z-index:100;
    }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="toolbar">
    <label class="btn">📸<input type="file" accept="image/*" capture="environment" id="cameraInput"></label>
    <label class="btn">🖼<input type="file" accept="image/*" id="galleryInput"></label>
    <div class="btn" onclick="setMode('draw')">✏️</div>
    <div class="btn" onclick="setMode('erase')">🧽</div>
    <div class="btn" onclick="startCrop()">✂️</div>
    <div class="btn" onclick="addGeo()">📍</div>
    <div class="btn" onclick="openModal()">📝</div>
    <div class="btn" onclick="saveImage()">💾</div>
</div>

<div id="bottomBar">
    <div class="bottom-btn" id="undoBtn">↩️</div>
    <div class="bottom-btn" onclick="triggerCamera()">📸</div>
    <div class="bottom-btn" id="redoBtn">↪️</div>
</div>

<div id="modal">
    <div id="modalBox">
        <label>Название</label>
        <input id="titleInput" placeholder="Название фото">
        <label>Описание</label>
        <textarea id="descInput" rows="4" placeholder="Что на фото?"></textarea>
        <div id="modalButtons">
            <button id="cancelBtn" onclick="closeModal()">Отмена</button>
            <button id="okBtn" onclick="applyText()">OK</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let mode = "draw";
let drawing = false;
let lastX, lastY;
let history = [];
let redoStack = [];
let currentImage = new Image();

function resizeCanvas() {
    const data = canvas.toDataURL("image/jpeg", 0.92);
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    if (data !== "data:,") {
        const img = new Image();
        img.src = data;
        img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    }
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

function saveState() {
    history.push(canvas.toDataURL("image/jpeg", 0.92));
    redoStack = [];
}

function undo() {
    if (history.length > 1) {
        redoStack.push(history.pop());
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        img.src = history[history.length - 1];
    }
}

function redo() {
    if (redoStack.length > 0) {
        const state = redoStack.pop();
        history.push(state);
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        img.src = state;
    }
}

document.getElementById("undoBtn").onclick = undo;
document.getElementById("redoBtn").onclick = redo;

let undoTimer;
document.getElementById("undoBtn").addEventListener("mousedown", () => {
    undoTimer = setTimeout(() => {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        history = []; redoStack = []; currentImage.src = "";
        showToast("Холст очищен");
    }, 800);
});
document.getElementById("undoBtn").addEventListener("mouseup mouseleave", () => clearTimeout(undoTimer));

function loadImage(file) {
    const reader = new FileReader();
    reader.onload = e => {
        currentImage.onload = () => {
            ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);
            saveState();
        };
        currentImage.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

document.getElementById("cameraInput").onchange = e => loadImage(e.target.files[0]);
document.getElementById("galleryInput").onchange = e => loadImage(e.target.files[0]);

function triggerCamera() { document.getElementById("cameraInput").click(); }

function getPos(e) {
    const touch = e.touches && e.touches[0] || e.changedTouches && e.changedTouches[0] || e;
    const r = canvas.getBoundingClientRect();
    return { x: touch.clientX - r.left, y: touch.clientY - r.top };
}

canvas.addEventListener("touchstart", e => {
    e.preventDefault();
    const pos = getPos(e);
    drawing = true;
    lastX = pos.x; lastY = pos.y;
    if (mode === "draw" || mode === "erase") {
        ctx.beginPath(); ctx.moveTo(lastX, lastY);
    }
});

canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    if (!drawing) return;
    const pos = getPos(e);
    if (mode === "draw") {
        ctx.strokeStyle = "#ff0044"; ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.lineJoin = "round";
        ctx.moveTo(lastX, lastY); ctx.lineTo(pos.x, pos.y); ctx.stroke();
        lastX = pos.x; lastY = pos.y;
    } else if (mode === "erase") {
        ctx.clearRect(pos.x-15, pos.y-15, 30, 30);
    }
});

canvas.addEventListener("touchend", e => {
    e.preventDefault();
    drawing = false;
    if (mode === "draw" || mode === "erase") {
        saveState();
    } else if (mode === "addGeo") {
        const posTouch = getPos(e);
        navigator.geolocation.getCurrentPosition(geoPos => {
            const lat = geoPos.coords.latitude.toFixed(6);
            const lon = geoPos.coords.longitude.toFixed(6);
            const accuracy = Math.round(geoPos.coords.accuracy);
            const text = `📍 ${lat}, ${lon}`;
            const accText = accuracy > 0 ? ` (±${accuracy} м)` : '';

            const fontSize = 24;
            const padding = 15;
            const textWidth = ctx.measureText(text + accText).width + padding * 2;
            const boxHeight = 50;

            let x = posTouch.x - textWidth / 2; // центрируем по тапу
            let y = posTouch.y - boxHeight / 2;

            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.fillRect(x, y, textWidth + 10, boxHeight);

            ctx.fillStyle = "#ffffff";
            ctx.font = `bold ${fontSize}px Arial, sans-serif`;
            ctx.fillText(text + accText, x + padding, y + 35);

            saveState();
            showToast("Геотег добавлен на тапе (с погрешностью)");
            mode = "draw"; // возвращаемся
        }, err => showToast("Геолокация не доступна: " + err.message), { enableHighAccuracy: true });
    }
});

function setMode(m) { mode = m; }

function startCrop() {
    alert("Проведи пальцем по области для обрезки");
    mode = "crop";
    let start = null;
    const onStart = e => { e.preventDefault(); start = getPos(e); };
    const onEnd = e => {
        e.preventDefault();
        if (!start) return;
        const end = getPos(e);
        let x = Math.min(start.x, end.x), y = Math.min(start.y, end.y);
        let w = Math.abs(end.x - start.x), h = Math.abs(end.y - start.y);
        if (w > 20 && h > 20) {
            const cropped = ctx.getImageData(x, y, w, h);
            canvas.width = w; canvas.height = h;
            ctx.putImageData(cropped, 0, 0);
            currentImage.src = canvas.toDataURL("image/jpeg", 0.92);
            saveState();
        }
        mode = "draw";
        canvas.removeEventListener("touchstart", onStart);
        canvas.removeEventListener("touchend", onEnd);
    };
    canvas.addEventListener("touchstart", onStart, {once:true});
    canvas.addEventListener("touchend", onEnd, {once:true});
}

function addGeo() {
    setMode("addGeo");
    showToast("Тапни на фото, куда ставить геотег");
}

function openModal() {
    document.getElementById("modal").style.display = "flex";
    const now = new Date();
    document.getElementById("titleInput").value = now.toISOString().slice(0,19).replace(/[:T]/g,"-");
    document.getElementById("descInput").value = "";
}

function closeModal() { document.getElementById("modal").style.display = "none"; }

function applyText() {
    const title = document.getElementById("titleInput").value.trim() || "Фото";
    const desc = document.getElementById("descInput").value.trim() || "";

    const currentState = canvas.toDataURL("image/jpeg", 0.92);

    const base = new Image();
    base.src = currentState;
    base.onload = () => {
        ctx.drawImage(base, 0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "rgba(0,0,0,0.65)";
        ctx.fillRect(20, 20, canvas.width - 40, 140);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 38px Arial, sans-serif";
        ctx.fillText(title, 40, 75);

        ctx.font = "28px Arial, sans-serif";
        if (desc) {
            ctx.fillText(desc, 40, 125);
        }

        saveState();
        closeModal();
        showToast("Текст добавлен вверху!");
    };
}

function saveImage() {
    const title = document.getElementById("titleInput").value.trim() ||
                  "photo_" + new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
    canvas.toBlob(blob => {
        const a = document.createElement("a");
        a.download = title + ".jpg";
        a.href = URL.createObjectURL(blob);
        a.click();
        showToast("Сохранено как " + title + ".jpg");
    }, "image/jpeg", 0.92);
}

function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.style.display = "block";
    setTimeout(() => t.style.display = "none", 2200);
}
</script>
</body>
</html>
