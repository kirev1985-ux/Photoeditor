<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Photo Report Pro - Версия 1.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; color: white; }
        #viewport { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; touch-action: none; }
        canvas { background: #111; touch-action: none; display: block; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        #toolbar { position: fixed; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 10px; z-index: 100; }
        .btn { width: 50px; height: 50px; background: rgba(30,30,30,0.9); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; font-size: 24px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .btn.active { border: 2px solid #00ff00; background: rgba(0,255,0,0.15); }

        #bottomBar { position: fixed; bottom: 20px; left: 0; width: 100%; display: flex; justify-content: center; align-items: center; gap: 30px; z-index: 100; }
        .bottom-btn { width: 60px; height: 60px; background: rgba(40,40,40,0.9); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; font-size: 28px; display: flex; justify-content: center; align-items: center; }

        #modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 200; }
        #modalBox { width: 85%; background: #1a1a1a; padding: 20px; border-radius: 15px; }
        input, textarea { width: 100%; margin: 10px 0; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; box-sizing: border-box; font-size: 16px; }
        input[type=file] { display: none; }
    </style>
</head>
<body>

<div id="viewport">
    <canvas id="canvas"></canvas>
</div>

<div id="toolbar">
    <label class="btn">📸<input type="file" accept="image/*" capture="environment" id="cameraInput" onchange="handleFile(this)"></label>
    <div class="btn" id="textBtn" onclick="openModal()">📝</div>
    <div class="btn" id="geoBtn" onclick="addGeo()">📍</div>
    <div class="btn" onclick="saveImage()">💾</div>
</div>

<div id="bottomBar">
    <div class="bottom-btn" onclick="undo()">↩️</div>
    <div class="bottom-btn" onclick="document.getElementById('cameraInput').click()">📷</div>
    <div class="bottom-btn" onclick="location.reload()">🔄</div>
</div>

<div id="modal">
    <div id="modalBox">
        <h4 style="margin:0">Текст описания</h4>
        <input id="titleInput" placeholder="Заголовок">
        <textarea id="descInput" rows="3" placeholder="Описание"></textarea>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button onclick="closeModal()" style="flex:1; padding:12px; background:#444; color:#fff; border:none; border-radius:8px;">Отмена</button>
            <button onclick="applyText()" style="flex:1; padding:12px; background:#007bff; color:#fff; border:none; border-radius:8px;">ОК</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let history = [];
    let isDrawing = false;
    let lastX = 0, lastY = 0;
    
    // Память для текста
    let textData = JSON.parse(localStorage.getItem('saved_text')) || { title: "", desc: "" };

    function initCanvas() {
        const w = window.innerWidth * 0.95;
        const h = w * (16/9); // Вертикальный формат
        canvas.width = w * 2; canvas.height = h * 2;
        canvas.style.width = w + "px"; canvas.style.height = h + "px";
        ctx.scale(2, 2);
        ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = 4; ctx.strokeStyle = "red";
        ctx.fillStyle = "#1a1a1a"; ctx.fillRect(0, 0, w, h);
        saveState();
    }

    function handleFile(input) {
        if (!input.files[0]) return;
        const img = new Image();
        img.onload = () => {
            const cw = canvas.width / 2, ch = canvas.height / 2;
            ctx.clearRect(0, 0, cw, ch);
            const ratio = Math.max(cw / img.width, ch / img.height);
            ctx.drawImage(img, (cw - img.width * ratio) / 2, (ch - img.height * ratio) / 2, img.width * ratio, img.height * ratio);
            // Авто-наложение текста при загрузке нового фото
            if(textData.title || textData.desc) drawTextBlock();
            saveState();
        };
        img.src = URL.createObjectURL(input.files[0]);
    }

    function openModal() {
        document.getElementById("titleInput").value = textData.title;
        document.getElementById("descInput").value = textData.desc;
        document.getElementById("modal").style.display = "flex";
    }

    function closeModal() { document.getElementById("modal").style.display = "none"; }

    function applyText() {
        textData.title = document.getElementById("titleInput").value;
        textData.desc = document.getElementById("descInput").value;
        localStorage.setItem('saved_text', JSON.stringify(textData));
        drawTextBlock();
        closeModal();
    }

    function drawTextBlock() {
        const cw = canvas.width / 2;
        ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(10, 20, cw - 20, 60);
        ctx.fillStyle = "white";
        ctx.font = "bold 15px Arial"; ctx.fillText(textData.title, 20, 42);
        ctx.font = "13px Arial"; ctx.fillText(textData.desc, 20, 62);
        saveState();
    }

    function addGeo() {
        navigator.geolocation.getCurrentPosition((p) => {
            const lat = p.coords.latitude.toFixed(6), lon = p.coords.longitude.toFixed(6);
            const cw = canvas.width / 2, ch = canvas.height / 2;
            ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(10, ch - 65, cw - 20, 55);
            ctx.fillStyle = "white";
            ctx.font = "bold 14px Arial"; ctx.fillText(`📍 ${lat}, ${lon}`, 20, ch - 42);
            ctx.font = "12px Arial"; ctx.fillText(`${new Date().toLocaleString()} (±${p.coords.accuracy.toFixed(0)}m)`, 20, ch - 22);
            saveState();
        }, () => alert("Включи GPS"), { enableHighAccuracy: true });
    }

    function saveState() { history.push(canvas.toDataURL()); if (history.length > 15) history.shift(); }

    function undo() {
        if (history.length > 1) {
            history.pop();
            const img = new Image();
            img.onload = () => { ctx.clearRect(0,0,canvas.width/2,canvas.height/2); ctx.drawImage(img,0,0,canvas.width/2,canvas.height/2); };
            img.src = history[history.length - 1];
        }
    }

    function saveImage() {
        const link = document.createElement('a');
        link.download = `REPORT_${Date.now()}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
    }

    // Рисование (плавное)
    canvas.addEventListener('touchstart', (e) => {
        isDrawing = true; const r = canvas.getBoundingClientRect();
        const t = e.touches[0];
        lastX = (t.clientX - r.left) * (canvas.width / r.width / 2);
        lastY = (t.clientY - r.top) * (canvas.height / r.height / 2);
    });
    canvas.addEventListener('touchmove', (e) => {
        if (!isDrawing) return; e.preventDefault();
        const r = canvas.getBoundingClientRect(); const t = e.touches[0];
        const x = (t.clientX - r.left) * (canvas.width / r.width / 2);
        const y = (t.clientY - r.top) * (canvas.height / r.height / 2);
        ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y); ctx.stroke();
        lastX = x; lastY = y;
    });
    canvas.addEventListener('touchend', () => { isDrawing = false; saveState(); });

    window.onload = initCanvas;
</script>
</body>
</html>
