<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PhotoEditor V20</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #000; font-family: sans-serif; overflow: hidden; color: white; touch-action: none; }
        canvas { display: block; background: #111; margin: 0 auto; }
        #gps-live { position: fixed; top: 0; left: 0; width: 100%; background: rgba(0,0,0,0.8); font-size: 11px; padding: 5px; text-align: center; z-index: 20; }
        #side-menu { position: fixed; right: 10px; top: 50px; display: flex; flex-direction: column; gap: 12px; z-index: 10; }
        .btn-side { width: 56px; height: 56px; background: #333; border: 1px solid #555; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 22px; }
        .btn-label { font-size: 10px; font-weight: bold; margin-top: -2px; }
        
        #bottom-menu { position: fixed; bottom: 110px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 30px; z-index: 10; }
        .btn-cam { width: 80px; height: 80px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #000; border: 5px solid #444; }
        
        #save-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 3000; }
        .save-ui-btn { width: 85%; padding: 20px; margin: 10px; border-radius: 15px; font-weight: bold; font-size: 18px; text-align: center; border: none; }
        
        #modal-iso { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1001; }
        .iso-choice { width: 240px; padding: 20px; margin: 10px; border-radius: 15px; text-align: center; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

<div id="gps-live">Ожидание GPS...</div>
<canvas id="canvas"></canvas>

<div id="side-menu">
    <div class="btn-side" onclick="stampGPS()">📍<span class="btn-label">GPS</span></div>
    <div class="btn-side" onclick="updateNote()">📝<span class="btn-label">ТЕКСТ</span></div>
    <div class="btn-side" onclick="startSave('ТАЙНИК')">🧰<span class="btn-label">Т</span></div>
    <div class="btn-side" onclick="startSave('МАГНИТ')">🧲<span class="btn-label">М</span></div>
</div>

<div id="bottom-menu">
    <div class="btn-side" onclick="undo()">↩️</div>
    <div class="btn-cam" onclick="document.getElementById('hiddenInput').click()">📷</div>
    <div class="btn-side" onclick="location.reload()">🔄</div>
</div>

<div id="modal-iso">
    <h3 id="iso-title">ВЫБЕРИТЕ ТИП:</h3>
    <div class="iso-choice" style="background:#b00; border: 2px solid white;" onclick="finalizeSave('КРАСНАЯ ИЗО', 'red')">КРАСНАЯ ИЗО</div>
    <div class="iso-choice" style="background:#b80; border: 2px solid white;" onclick="finalizeSave('ЖЕЛТАЯ ИЗО', 'yellow')">ЖЕЛТАЯ ИЗО</div>
    <div class="iso-choice" style="background:#0056b3; border: 2px solid white;" onclick="finalizeSave('КАМЕНЬ', '#007bff')">КАМЕНЬ</div>
    <div style="margin-top:30px; color:#aaa" onclick="document.getElementById('modal-iso').style.display='none'">ОТМЕНА</div>
</div>

<input type="file" id="hiddenInput" accept="image/*" capture="environment" style="display:none" onchange="loadPhoto(this)">

<div id="save-screen">
    <img id="save-img" style="max-width: 90%; max-height: 50%; border: 2px solid white; margin-bottom: 20px;">
    <button class="save-ui-btn" style="background:#28a745; color:white;" onclick="downloadImg()">💾 СКАЧАТЬ В ГАЛЕРЕЮ</button>
    <button class="save-ui-btn" style="background:#555; color:white;" onclick="document.getElementById('save-screen').style.display='none'">← ВЕРНУТЬСЯ</button>
</div>

<script>
    const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    let history = [], currentNote = "", lastGPS = { lat: 0, lon: 0, acc: 0 }, baseImage = null;
    let selectedType = ""; // Тайник или Магнит

    window.onload = () => {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        navigator.geolocation.watchPosition(p => {
            lastGPS = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy };
            const gpsDiv = document.getElementById('gps-live');
            gpsDiv.style.color = lastGPS.acc > 15 ? '#ff4444' : '#00ff00';
            gpsDiv.innerText = `GPS: ${lastGPS.lat.toFixed(6)}, ${lastGPS.lon.toFixed(6)} (±${lastGPS.acc.toFixed(1)}м)`;
        }, null, { enableHighAccuracy: true });
    };

    function loadPhoto(input) {
        if (!input.files[0]) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => { baseImage = img; render(); };
            img.src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
    }

    function render() {
        if (!baseImage) return;
        const ratio = Math.min(canvas.width / baseImage.width, canvas.height / baseImage.height);
        const w = baseImage.width * ratio, h = baseImage.height * ratio;
        ctx.clearRect(0,0, canvas.width, canvas.height);
        ctx.fillStyle = "#000"; ctx.fillRect(0,0, canvas.width, canvas.height);
        ctx.drawImage(baseImage, (canvas.width - w)/2, (canvas.height - h)/2, w, h);
        
        if (currentNote) {
            ctx.font = "bold 18px Arial";
            const words = currentNote.split(' '), lines = []; let line = '';
            for (let n = 0; n < words.length; n++) {
                let test = line + words[n] + ' ';
                if (ctx.measureText(test).width > canvas.width - 40) { lines.push(line); line = words[n] + ' '; }
                else { line = test; }
            }
            lines.push(line);
            const boxH = lines.length * 25 + 15;
            ctx.fillStyle = "rgba(0,0,0,0.7)"; 
            ctx.fillRect(0, canvas.height - 40 - boxH, canvas.width, boxH);
            ctx.fillStyle = "white"; ctx.textAlign = "center";
            lines.forEach((l, i) => ctx.fillText(l.trim(), canvas.width/2, (canvas.height - 35 - boxH) + 22 + (i*25)));
        }
    }

    // Рисование (Красный маркер)
    let drawing = false, lastX = 0, lastY = 0;
    canvas.addEventListener('touchstart', e => { drawing = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; ctx.beginPath(); ctx.moveTo(lastX, lastY); });
    canvas.addEventListener('touchmove', e => { if (!drawing) return; e.preventDefault(); ctx.strokeStyle = "red"; ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.lineTo(e.touches[0].clientX, e.touches[0].clientY); ctx.stroke(); });
    canvas.addEventListener('touchend', () => { drawing = false; saveStep(); });

    function stampGPS() {
        const txt = `📍 ${lastGPS.lat.toFixed(6)}, ${lastGPS.lon.toFixed(6)} (±${lastGPS.acc.toFixed(1)}м)`;
        ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
        ctx.fillStyle = (lastGPS.acc > 15) ? "#ff4444" : "#00ff00";
        ctx.font = "bold 16px Arial"; ctx.textAlign = "center";
        ctx.fillText(txt, canvas.width/2, canvas.height - 15);
        saveStep();
    }

    function updateNote() {
        const n = prompt("Описание:", currentNote);
        if (n !== null) { currentNote = n; render(); saveStep(); }
    }

    // НАЧАЛО СОХРАНЕНИЯ (Выбор Т или М)
    function startSave(type) {
        selectedType = type;
        document.getElementById('iso-title').innerText = type;
        document.getElementById('modal-iso').style.display = 'flex';
    }

    // ФИНАЛЬНЫЙ ШТАМП (Две строки)
    function finalizeSave(isoLabel, color) {
        ctx.fillStyle = "rgba(0,0,0,0.8)"; 
        ctx.fillRect(10, 45, 170, 55); // Увеличил высоту под 2 строки
        ctx.strokeStyle = color; ctx.lineWidth = 3; 
        ctx.strokeRect(10, 45, 170, 55);
        
        ctx.fillStyle = "white"; ctx.font = "bold 13px Arial"; ctx.textAlign = "center";
        ctx.fillText(selectedType, 95, 65); // Первая строка (ТАЙНИК/МАГНИТ)
        
        ctx.fillStyle = color; ctx.font = "bold 13px Arial";
        ctx.fillText(isoLabel, 95, 87); // Вторая строка (ИЗО)
        
        document.getElementById('modal-iso').style.display = 'none';
        document.getElementById('save-img').src = canvas.toDataURL("image/png");
        document.getElementById('save-screen').style.display = 'flex';
    }

    function downloadImg() {
        const link = document.createElement('a');
        link.download = `photo_${Date.now()}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
    }

    function saveStep() { history.push(canvas.toDataURL()); if(history.length > 10) history.shift(); }
    function undo() { if(history.length > 1) { history.pop(); const i = new Image(); i.onload = () => { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(i,0,0); }; i.src = history[history.length-1]; } }
</script>
</body>
</html>
