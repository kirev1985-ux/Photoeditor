<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PhotoEditor V26 - Ink Fix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #000; font-family: sans-serif; overflow: hidden; color: white; touch-action: none; }
        canvas { display: block; background: #111; margin: 0 auto; touch-action: none; }
        #gps-live { position: fixed; top: 0; left: 0; width: 100%; background: rgba(0,0,0,0.8); font-size: 11px; padding: 5px; text-align: center; z-index: 20; }
        #side-menu { position: fixed; right: 10px; top: 50px; display: flex; flex-direction: column; gap: 12px; z-index: 10; }
        .btn-side { width: 56px; height: 56px; background: #333; border: 1px solid #555; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 22px; }
        .btn-label { font-size: 10px; font-weight: bold; margin-top: -2px; }
        #bottom-menu { position: fixed; bottom: 110px; width: 100%; display: center; justify-content: center; align-items: center; gap: 30px; z-index: 10; display: flex; }
        .btn-cam { width: 80px; height: 80px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #000; border: 5px solid #444; }
        #save-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 3000; }
        .save-ui-btn { width: 85%; padding: 20px; margin: 10px; border-radius: 15px; font-weight: bold; font-size: 18px; text-align: center; border: none; }
        #modal-iso { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1001; }
        .iso-choice { width: 240px; padding: 18px; margin: 8px; border-radius: 15px; text-align: center; font-weight: bold; font-size: 16px; }
        #sticky-indicator { font-size: 12px; color: #0f0; display: none; position: absolute; top: -5px; right: -5px; background: #000; border-radius: 50%; width: 18px; height: 18px; text-align: center; border: 1px solid #0f0; }
    </style>
</head>
<body>

<div id="gps-live">Ожидание GPS...</div>
<canvas id="canvas"></canvas>

<div id="side-menu">
    <div class="btn-side" onclick="toggleGPS()">📍<span class="btn-label">GPS</span></div>
    <div class="btn-side" style="position:relative;" onclick="updateNote()">
        <div id="sticky-indicator">✓</div>
        📝<span class="btn-label">ТЕКСТ</span>
    </div>
    <div class="btn-side" onclick="startSave('ТАЙНИК')">🧰<span class="btn-label">Т</span></div>
    <div class="btn-side" onclick="startSave('МАГНИТ')">🧲<span class="btn-label">М</span></div>
</div>

<div id="bottom-menu">
    <div class="btn-side" onclick="undo()">↩️</div>
    <div class="btn-cam" onclick="document.getElementById('hiddenInput').click()">📷</div>
    <div class="btn-side" onclick="location.reload()">🔄</div>
</div>

<div id="modal-iso">
    <h3>ВЫБЕРИТЕ ТИП:</h3>
    <div class="iso-choice" style="background:#b00; border: 2px solid white;" onclick="setIso('КРАСНАЯ ИЗО', 'red')">КРАСНАЯ ИЗО</div>
    <div class="iso-choice" style="background:#b80; border: 2px solid white;" onclick="setIso('ЖЕЛТАЯ ИЗО', 'yellow')">ЖЕЛТАЯ ИЗО</div>
    <div class="iso-choice" style="background:#0056b3; border: 2px solid white;" onclick="setIso('КАМЕНЬ', '#007bff')">ЧЕРНАЯ ИЗО</div>
    <div class="iso-choice" style="background:#555; border: 2px solid white;" onclick="setIso('ПОДЪЕЗД', '#ccc')">БЕЛАЯ</div>
    <div style="margin-top:20px; color:#aaa" onclick="document.getElementById('modal-iso').style.display='none'">ОТМЕНА</div>
</div>

<input type="file" id="hiddenInput" accept="image/*" capture="environment" style="display:none" onchange="loadPhoto(this)">

<div id="save-screen">
    <img id="save-img" style="max-width: 90%; max-height: 55%; border: 2px solid white; margin-bottom: 20px;">
    <button class="save-ui-btn" style="background:#28a745; color:white;" onclick="downloadImg()">💾 СКАЧАТЬ В ГАЛЕРЕЮ</button>
    <button class="save-ui-btn" style="background:#555; color:white;" onclick="closeSave()">← ВЕРНУТЬСЯ</button>
</div>

<script>
    const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    const inkCanvas = document.createElement('canvas'); // Скрытый холст для хранения рисунка
    const ictx = inkCanvas.getContext('2d');

    let history = [], baseImage = null;
    let currentNote = "", isStickyNote = false, gpsStamp = null, isoStamp = null;
    let lastGPS = { lat: 0, lon: 0, acc: 0 }, drawing = false;

    window.onload = () => {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        inkCanvas.width = canvas.width; inkCanvas.height = canvas.height;
        navigator.geolocation.watchPosition(p => {
            lastGPS = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy };
            const gDiv = document.getElementById('gps-live');
            gDiv.style.color = lastGPS.acc > 15 ? '#ff4444' : '#00ff00';
            gDiv.innerText = `GPS: ${lastGPS.lat.toFixed(6)}, ${lastGPS.lon.toFixed(6)} (±${lastGPS.acc.toFixed(1)}м)`;
        }, null, { enableHighAccuracy: true });
    };

    function loadPhoto(input) {
        if (!input.files[0]) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => { 
                baseImage = img; 
                ictx.clearRect(0,0,inkCanvas.width,inkCanvas.height);
                if (!isStickyNote) currentNote = "";
                gpsStamp = null; isoStamp = null; history = [];
                render(); 
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
    }

    function render() {
        if (!baseImage) return;
        const ratio = Math.min(canvas.width/baseImage.width, canvas.height/baseImage.height);
        const w = baseImage.width*ratio, h = baseImage.height*ratio;
        ctx.fillStyle = "#000"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(baseImage, (canvas.width-w)/2, (canvas.height-h)/2, w, h);
        
        // НАКЛАДЫВАЕМ РИСУНОК ПОВЕРХ ФОТО
        ctx.drawImage(inkCanvas, 0, 0);
        
        drawUI();
    }

    function drawUI() {
        if (isoStamp) {
            ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(10, 45, 170, 55);
            ctx.strokeStyle = isoStamp.color; ctx.lineWidth = 3; ctx.strokeRect(10, 45, 170, 55);
            ctx.fillStyle = "white"; ctx.font = "bold 13px Arial"; ctx.textAlign = "center";
            ctx.fillText(isoStamp.type, 95, 65);
            ctx.fillStyle = isoStamp.color; ctx.fillText(isoStamp.label, 95, 87);
        }
        if (currentNote) {
            ctx.font = "bold 18px Arial";
            const words = currentNote.split(' '), lines = []; let line = '';
            for (let n=0; n<words.length; n++) {
                let test = line + words[n] + ' ';
                if (ctx.measureText(test).width > canvas.width-40) { lines.push(line); line = words[n] + ' '; }
                else { line = test; }
            }
            lines.push(line);
            const boxH = lines.length*25 + 15;
            ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(0, canvas.height-40-boxH, canvas.width, boxH);
            ctx.fillStyle = "white"; ctx.textAlign = "center";
            lines.forEach((l, i) => ctx.fillText(l.trim(), canvas.width/2, (canvas.height-35-boxH)+22+(i*25)));
        }
        if (gpsStamp) {
            ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(0, canvas.height-40, canvas.width, 40);
            ctx.fillStyle = gpsStamp.acc > 15 ? "#ff4444" : "#00ff00";
            ctx.font = "bold 16px Arial"; ctx.textAlign = "center";
            ctx.fillText(gpsStamp.text, canvas.width/2, canvas.height-15);
        }
    }

    // Рисуем на вспомогательном холсте, чтобы не стерлось
    canvas.addEventListener('touchstart', e => { 
        drawing = true; 
        ictx.beginPath(); ictx.moveTo(e.touches[0].clientX, e.touches[0].clientY); 
    });
    canvas.addEventListener('touchmove', e => { 
        if (!drawing) return; e.preventDefault(); 
        ictx.strokeStyle = "red"; ictx.lineWidth = 4; ictx.lineCap = "round";
        ictx.lineTo(e.touches[0].clientX, e.touches[0].clientY); ictx.stroke();
        render(); // Обновляем основной экран
    });
    canvas.addEventListener('touchend', () => { drawing = false; saveStep(); });

    function toggleGPS() {
        gpsStamp = { text: `📍 ${lastGPS.lat.toFixed(6)}, ${lastGPS.lon.toFixed(6)} (±${lastGPS.acc.toFixed(1)}м)`, acc: lastGPS.acc };
        render(); saveStep();
    }

    function updateNote() {
        const n = prompt("Описание:", currentNote);
        if (n !== null) {
            currentNote = n;
            isStickyNote = confirm("Закрепить описание?");
            document.getElementById('sticky-indicator').style.display = isStickyNote ? 'block' : 'none';
            render(); saveStep();
        }
    }

    function startSave(t) { isoStamp = { type: t }; document.getElementById('modal-iso').style.display = 'flex'; }
    function setIso(l, c) {
        isoStamp.label = l; isoStamp.color = c;
        document.getElementById('modal-iso').style.display = 'none';
        render();
        document.getElementById('save-img').src = canvas.toDataURL("image/png");
        document.getElementById('save-screen').style.display = 'flex';
    }

    function downloadImg() {
        const link = document.createElement('a');
        link.download = `photo_${Date.now()}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
    }

    function closeSave() { document.getElementById('save-screen').style.display = 'none'; }
    
    function saveStep() { 
        // Сохраняем и фото, и рисунок в историю
        history.push({img: baseImage ? baseImage.src : null, ink: inkCanvas.toDataURL()}); 
        if(history.length > 10) history.shift(); 
    }

    function undo() {
        if(history.length > 1) {
            history.pop();
            const state = history[history.length-1];
            const ink = new Image();
            ink.onload = () => {
                ictx.clearRect(0,0,inkCanvas.width,inkCanvas.height);
                ictx.drawImage(ink, 0, 0);
                render();
            };
            ink.src = state.ink;
        }
    }
</script>
</body>
</html>
