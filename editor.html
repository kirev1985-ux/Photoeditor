<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мини‑редактор</title>
<style>
    body { margin: 0; background: #000; color: #fff; font-family: sans-serif; text-align: center; }
    #tools { display: flex; justify-content: center; gap: 10px; padding: 10px; background: #111; }
    button { padding: 10px 15px; background: #222; color: #fff; border: 1px solid #444; border-radius: 5px; }
    canvas { max-width: 100%; background: #000; }
</style>
</head>
<body>

<h3>Мини‑редактор</h3>

<input type="file" accept="image/*" capture="camera" id="photoInput">

<div id="tools">
    <button onclick="mode='draw'">✏️ Рисовать</button>
    <button onclick="mode='erase'">🧽 Ластик</button>
    <button onclick="cropMode()">✂️ Обрезать</button>
    <button onclick="addGeo()">📍 Геолокация</button>
    <button onclick="addDesc()">📝 Описание</button>
    <button onclick="saveImage()">💾 Сохранить</button>
</div>

<canvas id="canvas"></canvas>

<script>
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");
let img = new Image();
let mode = "draw";
let drawing = false;
let startX, startY;

document.getElementById("photoInput").onchange = function(e) {
    let file = e.target.files[0];
    let reader = new FileReader();
    reader.onload = function(event) {
        img.onload = function() {
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
        };
        img.src = event.target.result;
    };
    reader.readAsDataURL(file);
};

canvas.addEventListener("mousedown", e => {
    drawing = true;
    startX = e.offsetX;
    startY = e.offsetY;
});

canvas.addEventListener("mouseup", () => drawing = false);

canvas.addEventListener("mousemove", e => {
    if (!drawing) return;

    if (mode === "draw") {
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 5;
        ctx.lineTo(e.offsetX, e.offsetY);
        ctx.stroke();
    }

    if (mode === "erase") {
        ctx.clearRect(e.offsetX - 10, e.offsetY - 10, 20, 20);
    }
});

function cropMode() {
    mode = "crop";
    alert("Выдели область: нажми и потяни мышью");
    canvas.onmousedown = function(e) {
        startX = e.offsetX;
        startY = e.offsetY;
        drawing = true;
    };
    canvas.onmouseup = function(e) {
        drawing = false;
        let w = e.offsetX - startX;
        let h = e.offsetY - startY;
        let cropped = ctx.getImageData(startX, startY, w, h);
        canvas.width = w;
        canvas.height = h;
        ctx.putImageData(cropped, 0, 0);
        mode = "draw";
    };
}

function addGeo() {
    if (!navigator.geolocation) {
        alert("Геолокация недоступна");
        return;
    }
    navigator.geolocation.getCurrentPosition(pos => {
        let text = `📍 ${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
        ctx.font = "40px sans-serif";
        ctx.fillStyle = "white";
        ctx.fillText(text, 20, canvas.height - 40);
    });
}

function addDesc() {
    let text = prompt("Введите описание:");
    if (text) {
        ctx.font = "40px sans-serif";
        ctx.fillStyle = "white";
        ctx.fillText(text, 20, 60);
    }
}

function saveImage() {
    let link = document.createElement("a");
    link.download = "edited.jpg";
    link.href = canvas.toDataURL("image/jpeg");
    link.click();
}
</script>

</body>
</html>
